          String fmt(num b) {
            if (b < 1024) return '${b.toInt()} B';
            const u = ['KB', 'MB', 'GB', 'TB'];
            double v = b / 1024;
            int i = 0;
            while (v >= 1024 && i < 3) {
              v /= 1024;
              i++;
            }
            return '${v.toStringAsFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2)} ${u[i]}';
          }

          Widget avatar(String name, {double size = 40}) {
            final ch = name.isEmpty ? '?' : name.characters.first.toUpperCase();
            final hue = (name.hashCode % 360).toDouble();
            final c = HSLColor.fromAHSL(1, hue, .55, .5).toColor();
            return Container(
              width: size,
              height: size,
              alignment: Alignment.center,
              decoration: BoxDecoration(
                color: c.withValues(alpha: .25),
                borderRadius: BorderRadius.circular(size / 3),
