          const periodKeys = ['today', 'week', 'month', 'm3', 'year', 'pick'];

          /// A day-aligned time range in epoch milliseconds, split into [n] chart buckets.
          class Range {
            final int s, e, n;
            final bool hourly; // single day shown as 24 hourly bars
            const Range(this.s, this.e, this.n, [this.hourly = false]);
          }

          /// Start of the billing cycle that contains [now]. [day] is 1..28.
          DateTime cycleStart(DateTime now, int day) =>
              DateTime(now.year, now.day < day ? now.month - 1 : now.month, day);

          /// Period index: 0 today, 1 week (7 days), 2 current billing cycle, 3 = 90 days, 4 = 365 days.
          Range rangeFor(int pi, int billing, [DateTimeRange? custom]) {
            final now = DateTime.now();
            int ms(DateTime d) => d.millisecondsSinceEpoch;
            final tomorrow = ms(DateTime(now.year, now.month, now.day + 1));
            switch (pi) {
              case 0:
                return Range(ms(DateTime(now.year, now.month, now.day)), tomorrow, 24, true);
              case 1:
                return Range(ms(DateTime(now.year, now.month, now.day - 6)), tomorrow, 7);
              case 2:
                {
                  final st = cycleStart(now, billing);
                  final en = DateTime(st.year, st.month + 1, st.day);
                  final days = ((ms(en) - ms(st)) / 86400000).round();
                  return Range(ms(st), ms(en), days < 1 ? 1 : days);
                }
              case 3:
                return Range(ms(DateTime(now.year, now.month, now.day - 89)), tomorrow, 13);
              case 4:
                return Range(ms(DateTime(now.year, now.month, now.day - 364)), tomorrow, 12);
              default:
                {
                  // 5 = a day (or range of days) picked by the user
                  final c = custom ??
                      DateTimeRange(start: DateTime(now.year, now.month, now.day), end: DateTime(now.year, now.month, now.day));
                  final a = DateTime(c.start.year, c.start.month, c.start.day);
                  final b = DateTime(c.end.year, c.end.month, c.end.day + 1);
                  final days = ((ms(b) - ms(a)) / 86400000).round();
                  return Range(ms(a), ms(b), days <= 1 ? 24 : (days <= 45 ? days : 15), days <= 1);
                }
            }
          }

          /// "11 May 2025" or "11 May 2025 – 20 May 2025", localized.
          String rangeLabel(BuildContext c, DateTimeRange r) {
            final l = MaterialLocalizations.of(c);
            final a = l.formatMediumDate(r.start);
            return DateUtils.isSameDay(r.start, r.end) ? a : '$a – ${l.formatMediumDate(r.end)}';
          }

          /// Linear projection of [used] to the end of range [r]; null while there is too little data.
          num? projectCycle(num used, Range r) {
            final el = DateTime.now().millisecondsSinceEpoch - r.s;
            if (el < 12 * 3600 * 1000 || used <= 0) return null;
            return used * (r.e - r.s) / el;
          }

