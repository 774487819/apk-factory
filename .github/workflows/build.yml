          String tr(String lang, String k, [Map<String, String>? args]) {
            var s = (_tr[lang] ?? _tr['en']!)[k] ?? _tr['en']![k] ?? k;
            if (args != null) {
              args.forEach((a, b) => s = s.replaceAll('{$a}', b));
            }
            return s;
          }

