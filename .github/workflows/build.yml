                                  const SizedBox(width: 12),
                                  Expanded(
                                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                      Row(children: [
                                        Expanded(child: Text(a.name, maxLines: 1, overflow: TextOverflow.ellipsis)),
                                        if (isLocked || st?.blocked == true)
                                          Container(
                                            margin: const EdgeInsetsDirectional.only(start: 8),
                                            padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                            decoration: BoxDecoration(
                                              color: Colors.redAccent.withValues(alpha: .18),
                                              borderRadius: BorderRadius.circular(8),
                                            ),
                                            child: Text(s.t(isLocked ? 'locked' : 'blocked'),
                                                style: const TextStyle(color: Colors.redAccent, fontSize: 11, fontWeight: FontWeight.w700)),
                                          ),
                                      ]),
                                      if (lim != null) ...[
                                        const SizedBox(height: 4),
                                        Text(
                                          '${s.t('limit')} ${fmt(limit)} • ${netNames[lim['net']]} • ${perNames[lim['period']]}',
                                          style: const TextStyle(color: kMob, fontSize: 12),
                                        ),
                                        if (st != null && limit > 0) ...[
                                          const SizedBox(height: 6),
                                          LinearProgressIndicator(
                                            value: (st.used / limit).clamp(0, 1).toDouble(),
                                            minHeight: 5,
                                            borderRadius: BorderRadius.circular(4),
                                            color: st.used >= limit ? Colors.redAccent : (st.used >= limit * .8 ? kWarn : kMob),
                                            backgroundColor: Colors.white12,
                                          ),
                                          const SizedBox(height: 4),
                                          Text('${s.t('used')}: ${fmt(st.used)} / ${fmt(limit)}',
