          /// Per-app details: Wi-Fi vs mobile, foreground vs background, usage over time.
          class AppDetailScreen extends StatefulWidget {
            final AppState s;
            final String pkg, name;
            const AppDetailScreen({super.key, required this.s, required this.pkg, required this.name});
            @override
            State<AppDetailScreen> createState() => _AppDetailScreenState();
          }

          class _AppDetailScreenState extends State<AppDetailScreen> {
            AppState get s => widget.s;
            late int idx; // 1..4 (no hourly view per app)
            AppDetail? d;
            String? err;

            @override
            void initState() {
              super.initState();
              idx = s.pi == 0 ? 1 : s.pi;
              _load();
            }

            Future<void> _load() async {
              final wanted = idx;
              setState(() {
                d = null;
                err = null;
              });
              try {
                final r = rangeFor(wanted, s.billing, s.custom);
                final m = await Native.detail(widget.pkg, r.s, r.e, r.hourly ? 1 : r.n);
                if (!mounted || wanted != idx) return;
                setState(() => d = AppDetail.fromMap(m));
              } catch (e) {
                if (mounted && wanted == idx) setState(() => err = '$e');
              }
            }

            @override
            Widget build(BuildContext context) {
              final det = d;
              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.name, overflow: TextOverflow.ellipsis),
                  backgroundColor: kBg,
                  actions: [
                    IconButton(
                      tooltip: s.t('opensettings'),
                      icon: const Icon(Icons.open_in_new_rounded),
                      onPressed: () => Native.openAppData(widget.pkg),
                    ),
                  ],
                ),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  Row(children: [
                    AppIcon(s: s, pkg: widget.pkg, name: widget.name, size: 48),
                    const SizedBox(width: 12),
                    Expanded(
                      child: Text(widget.pkg, style: const TextStyle(color: Colors.white54, fontSize: 12)),
                    ),
                  ]),
                  const SizedBox(height: 14),
                  SingleChildScrollView(
                    scrollDirection: Axis.horizontal,
                    child: Row(children: [
                      for (var i = 1; i < 5; i++)
                        Padding(
                          padding: const EdgeInsetsDirectional.only(end: 8),
                          child: ChoiceChip(
                            label: Text(s.t(periodKeys[i])),
                            selected: idx == i,
                            onSelected: (_) {
                              idx = i;
                              _load();
                            },
                          ),
                        ),
                    ]),
                  ),
                  if (idx == 5 && s.custom != null)
                    Padding(
                      padding: const EdgeInsets.only(top: 10),
                      child: Text(rangeLabel(context, s.custom!), style: const TextStyle(color: kWifi, fontWeight: FontWeight.w700)),
                    ),
                  const SizedBox(height: 14),
                  if (err != null)
                    InfoBanner(
                        icon: Icons.error_outline_rounded, text: s.t('err'), action: s.t('retry'), onAction: _load, color: Colors.redAccent)
                  else if (det == null)
                    const Padding(padding: EdgeInsets.all(40), child: Center(child: CircularProgressIndicator()))
                  else ...[
                    Row(children: [
                      NetCard(label: s.t('wifi'), value: det.wifi, color: kWifi, selected: false, onTap: () {}),
                      const SizedBox(width: 12),
                      NetCard(label: s.t('mobile'), value: det.mobile, color: kMob, selected: false, onTap: () {}),
                    ]),
                    const SizedBox(height: 14),
                    _fgBg(det),
                    const SizedBox(height: 14),
                    _chartCard(s.t('wifi'), det.sWifi, kWifi),
                    const SizedBox(height: 12),
                    _chartCard(s.t('mobile'), det.sMobile, kMob),
                  ],
                ]),
              );
            }

            Widget _fgBg(AppDetail det) {
              final total = det.fg + det.bg;
              return Container(
                padding: const EdgeInsets.all(16),
                decoration: cardBox(),
                child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  LinearProgressIndicator(
                    value: total > 0 ? (det.fg / total).toDouble() : 0,
                    minHeight: 8,
