          class _LimitSheetState extends State<LimitSheet> {
            late final TextEditingController ctl;
            late String net, per;
            late bool block;
            bool bad = false;
            AppState get s => widget.s;
            Map? get old => s.limits[widget.pkg] as Map?;

            @override
            void initState() {
              super.initState();
              final o = old;
              ctl = TextEditingController(text: o == null ? '100' : _mbText(o['bytes'] as num));
              net = (o?['net'] as String?) ?? 'mobile';
              per = (o?['period'] as String?) ?? 'month';
              block = (o?['block'] as bool?) ?? false;
            }

            @override
            void dispose() {
              ctl.dispose();
              super.dispose();
            }

            void _save() {
              final mb = double.tryParse(ctl.text.trim().replaceAll(',', '.'));
              if (mb == null || mb <= 0) {
                setState(() => bad = true);
                return;
              }
              s.limits[widget.pkg] = {'bytes': (mb * 1048576).round(), 'net': net, 'period': per, 'block': block};
              final wantsBlock = block;
              Navigator.pop(context);
              s.saveLimits().then((_) async {
                if (!wantsBlock) return;
                await s.refreshVpn();
                if (!s.vpnGranted) await s.ensureVpn();
              });
            }

            @override
            Widget build(BuildContext context) => SafeArea(
                  child: Padding(
                    padding: EdgeInsets.fromLTRB(20, 20, 20, 20 + MediaQuery.of(context).viewInsets.bottom),
                    child: SingleChildScrollView(
                      child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                        Row(children: [
                          avatar(widget.name),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Text(widget.name,
                                maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                          ),
                        ]),
                        const SizedBox(height: 16),
                        TextField(
                          controller: ctl,
                          keyboardType: const TextInputType.numberWithOptions(decimal: true),
                          decoration: InputDecoration(
                            labelText: s.t('lmb'),
                            errorText: bad ? s.t('badnum') : null,
                            border: OutlineInputBorder(borderRadius: BorderRadius.circular(14)),
                          ),
                        ),
                        const SizedBox(height: 14),
                        SizedBox(
                          width: double.infinity,
                          child: SegmentedButton<String>(
                            segments: [
                              ButtonSegment(value: 'mobile', label: Text(s.t('ms'))),
                              ButtonSegment(value: 'wifi', label: Text(s.t('ws'))),
                              ButtonSegment(value: 'all', label: Text(s.t('all'))),
                            ],
                            selected: {net},
                            onSelectionChanged: (v) => setState(() => net = v.first),
                          ),
                        ),
                        const SizedBox(height: 10),
                        SizedBox(
                          width: double.infinity,
                          child: SegmentedButton<String>(
                            segments: [
                              ButtonSegment(value: 'day', label: Text(s.t('daily'))),
                              ButtonSegment(value: 'month', label: Text(s.t('monthly'))),
                            ],
                            selected: {per},
                            onSelectionChanged: (v) => setState(() => per = v.first),
                          ),
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          value: block,
                          onChanged: (v) => setState(() => block = v),
                          title: Text(s.t('block'), style: const TextStyle(fontSize: 14)),
                          subtitle: Text(s.t('blockh'), style: const TextStyle(fontSize: 12)),
                        ),
                        if (s.status[widget.pkg]?.blocked == true)
                          Padding(
                            padding: const EdgeInsets.only(bottom: 8),
                            child: FilledButton.tonal(
                              onPressed: () {
                                Navigator.pop(context);
                                s.unblock(widget.pkg);
                              },
                              child: Text(s.t('unblock')),
                            ),
                          ),
                        const SizedBox(height: 6),
                        OutlinedButton.icon(
                          onPressed: () => Native.openAppData(widget.pkg),
                          icon: const Icon(Icons.open_in_new_rounded, size: 18),
                          label: Text(s.t('opensettings')),
                        ),
                        const SizedBox(height: 10),
                        Row(children: [
                          if (old != null)
                            Expanded(
                              child: TextButton(
                                onPressed: () {
                                  s.limits.remove(widget.pkg);
                                  Navigator.pop(context);
                                  s.saveLimits();
                                },
                                child: Text(s.t('remove')),
                              ),
                            ),
                          Expanded(child: FilledButton(onPressed: _save, child: Text(s.t('save')))),
                        ]),
                      ]),
                    ),
                  ),
                );
          }

          // ======================================================================
          // usage_tab.dart
          // ======================================================================
          class UsageTab extends StatelessWidget {
            final AppState s;
            const UsageTab({super.key, required this.s});

            String _name(AppUse a) {
              if (a.name.isNotEmpty) return a.name;
              return a.uid == -4
                  ? s.t('removed')
                  : a.uid == -5
                      ? s.t('teth')
                      : s.t('sys');
            }

            /// Date-range picker limited to the days that exist in the local history.
            Future<void> _pick(BuildContext context) async {
              final now = DateTime.now();
              final today = DateTime(now.year, now.month, now.day);
              var first = s.histStart ?? today.subtract(const Duration(days: 89));
              first = DateTime(first.year, first.month, first.day);
              if (first.isAfter(today)) first = today;
              var init = s.custom ?? DateTimeRange(start: today, end: today);
              if (init.start.isBefore(first) || init.end.isAfter(today)) init = DateTimeRange(start: today, end: today);
              final r = await showDateRangePicker(
                context: context,
                firstDate: first,
                lastDate: today,
                initialDateRange: init,
                helpText: s.t('pick'),
              );
              if (r != null) s.setCustom(r);
            }

            @override
            Widget build(BuildContext context) => ListenableBuilder(listenable: s, builder: (c, _) => _body(c));

            Widget _body(BuildContext context) {
              final isWifi = s.net == 0;
              final col = isWifi ? kWifi : kMob;
              final list = s.usage.where((a) => a.byNet(s.net) > 0).toList()
                ..sort((a, b) => b.byNet(s.net).compareTo(a.byNet(s.net)));
              final num mx = list.isEmpty ? 1 : list.first.byNet(s.net);
              final series = isWifi ? s.wifiSeries : s.mobSeries;
              final total = isWifi ? s.wifiTotal : s.mobTotal;
              final proj = s.pi == 2 ? projectCycle(total, rangeFor(2, s.billing)) : null;

              return RefreshIndicator(
                onRefresh: s.load,
                child: ListView(
                  physics: const AlwaysScrollableScrollPhysics(),
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(children: [
                      const Expanded(child: Text('Dataly', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold))),
                      if (s.loading)
                        const Padding(
                          padding: EdgeInsets.only(right: 8),
                          child: SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2)),
                        ),
                      IconButton(
                        icon: const Icon(Icons.settings_rounded),
                        tooltip: s.t('settings'),
                        onPressed: () => showSettingsSheet(context, s),
                      ),
                    ]),
                    const SizedBox(height: 8),
                    if (s.needPhone)
                      InfoBanner(
                        icon: Icons.phone_android_rounded,
                        text: s.t('phone_why'),
                        action: s.t('grant'),
                        onAction: s.grantPhone,
                      ),
                    if (s.error != null)
                      InfoBanner(
                        icon: Icons.error_outline_rounded,
                        text: s.t('err'),
                        action: s.t('retry'),
                        onAction: s.load,
                        color: Colors.redAccent,
                      ),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 4),
                      decoration: cardBox(),
                      child: SwitchListTile(
                        contentPadding: EdgeInsets.zero,
                        title: Text(s.t('speed'), style: const TextStyle(fontSize: 14)),
                        value: s.speed,
                        onChanged: s.toggleSpeed,
                      ),
                    ),
                    const SizedBox(height: 14),
                    SingleChildScrollView(
                      scrollDirection: Axis.horizontal,
                      child: Row(children: [
                        for (var i = 0; i < periodKeys.length; i++)
                          Padding(
                            padding: const EdgeInsetsDirectional.only(end: 8),
                            child: ChoiceChip(
                              avatar: i == 5 ? const Icon(Icons.calendar_month_rounded, size: 18) : null,
                              label: Text(i == 5 && s.pi == 5 && s.custom != null
                                  ? rangeLabel(context, s.custom!)
                                  : s.t(periodKeys[i])),
                              selected: s.pi == i,
                              onSelected: (_) => i == 5 ? _pick(context) : s.setPeriod(i),
                            ),
                          ),
                      ]),
                    ),
                    const SizedBox(height: 14),
                    Row(children: [
                      NetCard(label: s.t('uw'), value: s.wifiTotal, color: kWifi, selected: isWifi, onTap: () => s.setNet(0)),
                      const SizedBox(width: 12),
                      NetCard(label: s.t('um'), value: s.mobTotal, color: kMob, selected: !isWifi, onTap: () => s.setNet(1)),
                    ]),
                    const SizedBox(height: 14),
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: cardBox(),
                      child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        Text('${s.t('total')}: ${fmt(s.wifiTotal + s.mobTotal)}',
                            style: const TextStyle(fontSize: 15, fontWeight: FontWeight.w700)),
                        const SizedBox(height: 12),
                        BarChart(values: series, color: col),
                        if (proj != null) ...[
                          const SizedBox(height: 12),
                          Row(children: [
                            Icon(Icons.trending_up_rounded, size: 18, color: col),
                            const SizedBox(width: 8),
                            Text('${s.t('proj')}: ${fmt(proj)}', style: const TextStyle(fontSize: 13)),
                          ]),
                        ],
                      ]),
                    ),
                    const SizedBox(height: 18),
                    Text(s.t('top'), style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w600)),
                    const SizedBox(height: 8),
                    for (final a in list.take(40))
                      Padding(
                        padding: const EdgeInsets.only(bottom: 8),
                        child: Material(
                          color: kCard,
                          borderRadius: BorderRadius.circular(16),
                          child: InkWell(
                            borderRadius: BorderRadius.circular(16),
                            onTap: a.isRealApp
                                ? () => Navigator.of(context).push(MaterialPageRoute(
                                    builder: (_) => AppDetailScreen(s: s, pkg: a.pkg, name: _name(a))))
                                : null,
                            child: Padding(
                              padding: const EdgeInsets.all(12),
                              child: Row(children: [
                                avatar(_name(a)),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                    Text(_name(a), maxLines: 1, overflow: TextOverflow.ellipsis),
                                    const SizedBox(height: 6),
                                    LinearProgressIndicator(
                                      value: (a.byNet(s.net) / mx).toDouble(),
                                      minHeight: 5,
                                      borderRadius: BorderRadius.circular(4),
                                      color: col,
                                      backgroundColor: col.withValues(alpha: .15),
                                    ),
                                  ]),
                                ),
                                const SizedBox(width: 12),
                                Text(fmt(a.byNet(s.net)), style: const TextStyle(fontWeight: FontWeight.w600)),
                              ]),
                            ),
                          ),
                        ),
                      ),
                    if (list.isEmpty && !s.loading)
                      Padding(
                        padding: const EdgeInsets.all(24),
                        child: Center(
                          child: Text(
                            s.pi == 5 ? s.t('nodata') : '—',
                            textAlign: TextAlign.center,
                            style: const TextStyle(color: Colors.white54, height: 1.5),
                          ),
                        ),
                      ),
                  ],
                ),
              );
            }
          }

          // ======================================================================
          // app_detail.dart
          // ======================================================================
          /// Per-app details: Wi-Fi vs mobile, foreground vs background, usage over time.
          class AppDetailScreen extends StatefulWidget {
            final AppState s;
            final String pkg, name;
            const AppDetailScreen({super.key, required this.s, required this.pkg, required this.name});
            @override
            State<AppDetailScreen> createState() => _AppDetailScreenState();
          }

          class _AppDetailScreenState extends State<AppDetailScreen> {
            AppState get s => widget.s;
            late int idx; // 1..4 (no hourly view per app)
            AppDetail? d;
            String? err;

            @override
            void initState() {
              super.initState();
              idx = s.pi == 0 ? 1 : s.pi;
              _load();
            }

            Future<void> _load() async {
              final wanted = idx;
              setState(() {
                d = null;
                err = null;
              });
              try {
                final r = rangeFor(wanted, s.billing, s.custom);
                final m = await Native.detail(widget.pkg, r.s, r.e, r.hourly ? 1 : r.n);
                if (!mounted || wanted != idx) return;
                setState(() => d = AppDetail.fromMap(m));
              } catch (e) {
                if (mounted && wanted == idx) setState(() => err = '$e');
              }
            }

            @override
            Widget build(BuildContext context) {
              final det = d;
              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.name, overflow: TextOverflow.ellipsis),
                  backgroundColor: kBg,
                  actions: [
                    IconButton(
                      tooltip: s.t('opensettings'),
                      icon: const Icon(Icons.open_in_new_rounded),
                      onPressed: () => Native.openAppData(widget.pkg),
                    ),
                  ],
                ),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  Row(children: [
                    avatar(widget.name, size: 48),
                    const SizedBox(width: 12),
                    Expanded(
                      child: Text(widget.pkg, style: const TextStyle(color: Colors.white54, fontSize: 12)),
                    ),
                  ]),
                  const SizedBox(height: 14),
                  SingleChildScrollView(
                    scrollDirection: Axis.horizontal,
                    child: Row(children: [
                      for (var i = 1; i < 5; i++)
                        Padding(
                          padding: const EdgeInsetsDirectional.only(end: 8),
                          child: ChoiceChip(
                            label: Text(s.t(periodKeys[i])),
                            selected: idx == i,
                            onSelected: (_) {
                              idx = i;
                              _load();
                            },
                          ),
                        ),
                    ]),
                  ),
                  if (idx == 5 && s.custom != null)
                    Padding(
                      padding: const EdgeInsets.only(top: 10),
                      child: Text(rangeLabel(context, s.custom!), style: const TextStyle(color: kCyan, fontWeight: FontWeight.w700)),
                    ),
                  const SizedBox(height: 14),
                  if (err != null)
                    InfoBanner(
                        icon: Icons.error_outline_rounded, text: s.t('err'), action: s.t('retry'), onAction: _load, color: Colors.redAccent)
                  else if (det == null)
                    const Padding(padding: EdgeInsets.all(40), child: Center(child: CircularProgressIndicator()))
                  else ...[
                    Row(children: [
                      NetCard(label: s.t('wifi'), value: det.wifi, color: kWifi, selected: false, onTap: () {}),
                      const SizedBox(width: 12),
                      NetCard(label: s.t('mobile'), value: det.mobile, color: kMob, selected: false, onTap: () {}),
                    ]),
                    const SizedBox(height: 14),
                    _fgBg(det),
                    const SizedBox(height: 14),
                    _chartCard(s.t('wifi'), det.sWifi, kWifi),
                    const SizedBox(height: 12),
                    _chartCard(s.t('mobile'), det.sMobile, kMob),
                  ],
                ]),
              );
            }

            Widget _fgBg(AppDetail det) {
              final total = det.fg + det.bg;
              return Container(
                padding: const EdgeInsets.all(16),
                decoration: cardBox(),
                child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  LinearProgressIndicator(
                    value: total > 0 ? (det.fg / total).toDouble() : 0,
                    minHeight: 8,
                    borderRadius: BorderRadius.circular(6),
                    color: kWarn,
                    backgroundColor: Colors.white12,
                  ),
                  const SizedBox(height: 10),
                  Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
                    Text('${s.t('fg')}: ${fmt(det.fg)}', style: const TextStyle(fontSize: 13, color: kWarn)),
                    Text('${s.t('bg')}: ${fmt(det.bg)}', style: const TextStyle(fontSize: 13, color: Colors.white70)),
                  ]),
                ]),
              );
            }

            Widget _chartCard(String title, List<num> values, Color color) => Container(
                  padding: const EdgeInsets.all(16),
                  decoration: cardBox(),
                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                    Text('${s.t('perday')} • $title', style: TextStyle(color: color, fontSize: 12, fontWeight: FontWeight.w600)),
                    const SizedBox(height: 10),
                    BarChart(values: values, color: color),
                  ]),
                );
          }

          // ======================================================================
          // home.dart
          // ======================================================================
          class Home extends StatefulWidget {
            final AppState state;
            const Home({super.key, required this.state});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> with WidgetsBindingObserver {
            int tab = 0;
            AppState get s => widget.state;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              s.init();
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState st) {
              if (st == AppLifecycleState.resumed && s.ready) s.init();
            }

            @override
            Widget build(BuildContext context) => ListenableBuilder(
                  listenable: s,
                  builder: (context, _) {
                    if (s.access == null) {
                      return const Scaffold(body: Center(child: CircularProgressIndicator()));
                    }
                    if (s.lang.isEmpty) return _LangScreen(s: s);
                    if (s.access == false) return _Onboard(s: s);
                    return Scaffold(
                      body: SafeArea(
                        child: IndexedStack(
                          index: tab,
                          children: [UsageTab(s: s), ControlTab(s: s)],
                        ),
                      ),
                      bottomNavigationBar: NavigationBar(
                        selectedIndex: tab,
                        onDestinationSelected: (i) => setState(() => tab = i),
                        destinations: [
                          NavigationDestination(icon: const Icon(Icons.bar_chart_rounded), label: s.t('tu')),
                          NavigationDestination(icon: const Icon(Icons.tune_rounded), label: s.t('tc')),
                        ],
                      ),
                    );
                  },
                );
          }

          // ------------------------------------------------------------------ language

          class LangList extends StatelessWidget {
            final String current;
            final void Function(String) onPick;
            const LangList({super.key, required this.current, required this.onPick});

            @override
            Widget build(BuildContext context) => ListView(
                  shrinkWrap: true,
                  children: [
                    for (final e in langs.entries)
                      ListTile(
                        title: Text(e.value),
                        trailing: current == e.key ? const Icon(Icons.check_rounded, color: kMob) : null,
                        onTap: () => onPick(e.key),
                      ),
                  ],
                );
          }

          void showLangSheet(BuildContext context, AppState s) {
            showModalBottomSheet(
              context: context,
              backgroundColor: kCard,
              shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
              builder: (c) => SafeArea(
                child: LangList(
                  current: s.lang,
                  onPick: (l) {
                    Navigator.pop(c);
                    s.setLang(l);
                  },
                ),
              ),
            );
          }

          class _LangScreen extends StatelessWidget {
            final AppState s;
            const _LangScreen({required this.s});

            @override
            Widget build(BuildContext context) => Scaffold(
                  body: SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Column(children: [
                        const SizedBox(height: 32),
                        const Text('Dataly', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 8),
                        const Text('Choose your language • اختر لغتك', style: TextStyle(color: Colors.white70)),
                        const SizedBox(height: 24),
                        Expanded(child: LangList(current: '', onPick: s.setLang)),
                      ]),
                    ),
                  ),
                );
          }

          // ------------------------------------------------------------------ onboarding

          class _Onboard extends StatelessWidget {
            final AppState s;
            const _Onboard({required this.s});

            @override
            Widget build(BuildContext context) => Scaffold(
                  body: SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.all(28),
                      child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                        const Icon(Icons.data_usage_rounded, size: 72, color: kMob),
                        const SizedBox(height: 24),
                        Text(s.t('perm'), textAlign: TextAlign.center, style: const TextStyle(fontSize: 16, height: 1.5)),
                        const SizedBox(height: 28),
                        FilledButton(onPressed: Native.openAccess, child: Text(s.t('grant'))),
                        const SizedBox(height: 12),
                        TextButton(onPressed: () => showLangSheet(context, s), child: Text(s.t('lang'))),
                      ]),
                    ),
                  ),
                );
          }

          // ------------------------------------------------------------------ settings

          void showSettingsSheet(BuildContext context, AppState s) {
            showModalBottomSheet(
              context: context,
              backgroundColor: kCard,
              isScrollControlled: true,
              shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
              builder: (c) => SafeArea(
                child: ListenableBuilder(
                  listenable: s,
                  builder: (c2, _) => SingleChildScrollView(
                    child: Column(mainAxisSize: MainAxisSize.min, children: [
                      Padding(
                        padding: const EdgeInsets.fromLTRB(20, 20, 20, 8),
                        child: Align(
                          alignment: AlignmentDirectional.centerStart,
                          child: Text(s.t('settings'), style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                        ),
                      ),
                      ListTile(
                        leading: const Icon(Icons.language_rounded),
                        title: Text(s.t('lang')),
                        subtitle: Text(langs[s.lang] ?? ''),
                        onTap: () {
                          Navigator.pop(c);
                          showLangSheet(context, s);
                        },
                      ),
                      ListTile(
                        leading: const Icon(Icons.event_repeat_rounded),
                        title: Text(s.t('bill')),
                        subtitle: Text(s.t('billh')),
                        trailing: DropdownButton<int>(
                          value: s.billing,
                          underline: const SizedBox(),
                          items: [for (var d = 1; d <= 28; d++) DropdownMenuItem(value: d, child: Text('$d'))],
                          onChanged: (v) {
                            if (v != null) s.setBilling(v);
                          },
                        ),
                      ),
                      ListTile(
                        leading: const Icon(Icons.vpn_lock_rounded),
                        title: Text(s.t('vpnpol')),
                        subtitle: Text(s.t('vpnwhy'), style: const TextStyle(fontSize: 12)),
                      ),
                      for (final p in const ['skip', 'take'])
                        ListTile(
                          dense: true,
                          contentPadding: const EdgeInsetsDirectional.only(start: 72, end: 16),
                          title: Text(s.t(p == 'skip' ? 'vpn_skip' : 'vpn_take')),
                          trailing: s.vpnPolicy == p ? const Icon(Icons.check_rounded, color: kMob) : null,
                          onTap: () => s.setVpnPolicy(p),
                        ),
                      ListTile(
                        leading: const Icon(Icons.ios_share_rounded),
                        title: Text(s.t('export')),
                        subtitle: Text(s.t('exporth')),
                        onTap: () {
                          Navigator.pop(c);
                          s.exportCsv();
                        },
                      ),
                      const SizedBox(height: 8),
                    ]),
                  ),
                ),
              ),
            );
          }

          // ======================================================================
          // main.dart
          // ======================================================================
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const DatalyApp());
          }

          class DatalyApp extends StatefulWidget {
            const DatalyApp({super.key});
            @override
            State<DatalyApp> createState() => _DatalyAppState();
          }

          class _DatalyAppState extends State<DatalyApp> {
            final AppState s = AppState();
            String _lang = '';

            @override
            void initState() {
              super.initState();
              // Rebuild MaterialApp only when the language changes (drives locale + text direction).
              s.addListener(() {
                if (s.lang != _lang) setState(() => _lang = s.lang);
              });
            }

            @override
            void dispose() {
              s.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) => MaterialApp(
                  debugShowCheckedModeBanner: false,
                  title: 'Dataly',
                  locale: Locale(_lang.isEmpty ? 'en' : _lang),
                  supportedLocales: [for (final k in langs.keys) Locale(k)],
                  localizationsDelegates: const [
                    GlobalMaterialLocalizations.delegate,
                    GlobalWidgetsLocalizations.delegate,
                    GlobalCupertinoLocalizations.delegate,
                  ],
                  theme: ThemeData(
                    useMaterial3: true,
                    brightness: Brightness.dark,
                    scaffoldBackgroundColor: kBg,
                    colorScheme: const ColorScheme.dark(primary: kWifi, surface: kCard),
                  ),
                  home: Home(state: s),
                );
          }
          EOF

      - name: Install Android SDK Platform 37 (optional, Gradle also auto-downloads it)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" || "$SDKM" "platforms;android-37" || echo "Platform 37 will be fetched by Gradle"

      - name: Build release APK
        working-directory: app_build
        run: |
          # permission_handler 13 needs compileSdk 37; the Flutter template uses 36.
          # Notification channels / foreground service need minSdk 26.
          sed -i 's/flutter\.minSdkVersion/26/' android/app/build.gradle*
          sed -i 's/flutter\.compileSdkVersion/37/' android/app/build.gradle*
          echo "android.suppressUnsupportedCompileSdk=37" >> android/gradle.properties
          grep -n "compileSdk\|minSdk" android/app/build.gradle*
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dataly-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
