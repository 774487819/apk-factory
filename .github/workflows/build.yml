name: Build Dataly (APK + Google Play AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      action:
        description: 'build = build the app, create-keystore = make the Google Play upload key (run once)'
        type: choice
        default: build
        options:
          - build
          - create-keystore

jobs:
  # ------------------------------------------------------------------ one-time: upload key for Google Play
  create_keystore:
    if: "github.event_name == 'workflow_dispatch' && inputs.action == 'create-keystore'"
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate upload keystore
        run: |
          mkdir -p out
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore out/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Dataly, OU=Mobile, O=Dataly, C=US"
          base64 -w 0 out/upload-keystore.jks > out/KEYSTORE_BASE64.txt
          {
            echo "Create these 4 repository secrets (Settings > Secrets and variables > Actions):"
            echo ""
            echo "KEYSTORE_BASE64   = the whole content of KEYSTORE_BASE64.txt"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = upload"
            echo "KEY_PASSWORD      = $PASS"
          } > out/SECRETS.txt

      - name: Upload keystore (keep this repository PRIVATE and delete the artifact afterwards)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: out/
          retention-days: 1

  # ------------------------------------------------------------------ build the app
  build_apk:
    if: "github.event_name != 'workflow_dispatch' || inputs.action == 'build'"
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Install Packages
        run: |
          flutter create -a kotlin --org com.dataly --project-name dataly --platforms=android app_build
          cd app_build
          flutter pub add permission_handler
          flutter pub add flutter_localizations --sdk=flutter

      - name: Write Android resources (widget, tile icon, file provider)
        run: |
          mkdir -p app_build/android/app/src/main/res/drawable app_build/android/app/src/main/res/layout app_build/android/app/src/main/res/xml
          cat << 'EOF' > app_build/android/app/src/main/res/drawable/ic_stat_speed.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M8,4 L8,14 L5,14 L9,19 L13,14 L10,14 L10,4 Z" />
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M16,20 L16,10 L13,10 L17,5 L21,10 L18,10 L18,20 Z" />
          </vector>
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/drawable/widget_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FF141A2B" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/layout/widget_usage.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:orientation="vertical"
              android:padding="12dp">
              <TextView
                  android:id="@+id/w_today_label"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="0dp"
                  android:textColor="#FFFFFF"
                  android:textSize="13sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/w_today_wifi"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="0dp"
                  android:textColor="#5B8CFF"
                  android:textSize="15sp"
                  android:textStyle="normal" />
              <TextView
                  android:id="@+id/w_today_mob"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="0dp"
                  android:textColor="#2EE6A6"
                  android:textSize="15sp"
                  android:textStyle="normal" />
              <TextView
                  android:id="@+id/w_cycle_label"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:textColor="#FFFFFF"
                  android:textSize="13sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/w_cycle_wifi"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="0dp"
                  android:textColor="#5B8CFF"
                  android:textSize="15sp"
                  android:textStyle="normal" />
              <TextView
                  android:id="@+id/w_cycle_mob"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="0dp"
                  android:textColor="#2EE6A6"
                  android:textSize="15sp"
                  android:textStyle="normal" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/xml/widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:initialLayout="@layout/widget_usage"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="exports" path="exports/" />
          </paths>
          EOF

      - name: Configure Android Manifest
        run: |
          cat << 'EOF' > app_build/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <!-- Wi-Fi name (SSID): Android treats it as location data, so it needs the location permission -->
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <!-- Only needed on Android 8-9 to read mobile-data usage -->
              <uses-permission android:name="android.permission.READ_PHONE_STATE"
                  android:maxSdkVersion="28" />

              <application
                  android:label="Dataly"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Live speed notification -->
                  <service
                      android:name=".SpeedService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Shows live network speed in an ongoing notification" />
                  </service>

                  <!-- Quick Settings tile -->
                  <service
                      android:name=".SpeedTile"
                      android:exported="true"
                      android:icon="@drawable/ic_stat_speed"
                      android:label="Live speed"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

                  <!-- Local VPN used to block apps that reached their limit -->
                  <service
                      android:name=".BlockVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

                  <!-- Periodic history + limit checks, boot / update -->
                  <receiver android:name=".MonitorReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <!-- Home-screen widget -->
                  <receiver android:name=".DatalyWidget" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>

                  <!-- CSV sharing -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>

              <!-- Package visibility (replaces QUERY_ALL_PACKAGES, which Google Play restricts) -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT" />
                      <data android:mimeType="text/plain" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.settings.IGNORE_BACKGROUND_DATA_RESTRICTIONS_SETTINGS" />
                      <data android:scheme="package" />
                  </intent>
              </queries>
          </manifest>
          EOF

      - name: Write Native Kotlin Bridge (MainActivity.kt)
        run: |
          mkdir -p app_build/android/app/src/main/kotlin/com/dataly/dataly
          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/dataly/dataly/MainActivity.kt
          package com.dataly.dataly

          import android.Manifest
          import android.app.AlarmManager
          import android.app.AppOpsManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.app.usage.NetworkStats
          import android.app.usage.NetworkStatsManager
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ActivityNotFoundException
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.NetworkRequest
          import android.net.wifi.WifiManager
          import android.location.LocationManager
          import androidx.core.location.LocationManagerCompat
          import android.net.VpnService
          import android.net.TrafficStats
          import android.net.Uri
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.Process
          import android.os.SystemClock
          import android.provider.Settings
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.telephony.TelephonyManager
          import android.widget.RemoteViews
          import androidx.core.app.NotificationCompat
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicBoolean
          import org.json.JSONObject

          // ---------------------------------------------------------------- Core
          object Core {
              const val CH_ALERTS = "alerts"
              const val CH_SPEED = "speed"
              private val lock = Any()

              class Use(var total: Long = 0L, var fg: Long = 0L)

              // ---------------- prefs & strings ----------------
              fun prefs(c: Context): SharedPreferences =
                  c.applicationContext.getSharedPreferences("dataly", Context.MODE_PRIVATE)

              /** Localized strings pushed from Flutter (notifications, widget, tile). */
              fun str(c: Context, key: String, def: String = ""): String =
                  prefs(c).getString("s_$key", null)?.takeIf { it.isNotEmpty() } ?: def

              fun limits(c: Context): JSONObject =
                  try { JSONObject(prefs(c).getString("limits", "{}") ?: "{}") } catch (_: Exception) { JSONObject() }

              fun billingDay(c: Context): Int = prefs(c).getInt("bill", 1).coerceIn(1, 28)

              // ---------------- permissions ----------------
              @Suppress("DEPRECATION")
              fun hasUsageAccess(c: Context): Boolean {
                  val a = c.getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = if (Build.VERSION.SDK_INT >= 29)
                      a.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), c.packageName)
                  else
                      a.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), c.packageName)
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              /** Android 8-9 need the subscriber id to read mobile-data stats; Android 10+ accept null. */
              @Suppress("DEPRECATION", "HardwareIds", "MissingPermission")
              private fun subscriber(c: Context, type: Int): String? {
                  if (type != ConnectivityManager.TYPE_MOBILE || Build.VERSION.SDK_INT >= 29) return null
                  return try {
                      if (c.checkSelfPermission(Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED) null
                      else (c.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager).subscriberId
                  } catch (_: Exception) { null }
              }

              // ---------------- network stats ----------------
              fun usageByUid(c: Context, type: Int, s: Long, e: Long): Map<Int, Use> {
                  val out = HashMap<Int, Use>()
                  try {
                      val m = c.getSystemService(Context.NETWORK_STATS_SERVICE) as NetworkStatsManager
                      val st = m.querySummary(type, subscriber(c, type), s, e)
                      val b = NetworkStats.Bucket()
                      try {
                          while (st.hasNextBucket()) {
                              st.getNextBucket(b)
                              val u = out.getOrPut(b.uid) { Use() }
                              val x = b.rxBytes + b.txBytes
                              u.total += x
                              if (b.state == NetworkStats.Bucket.STATE_FOREGROUND) u.fg += x
                          }
                      } finally { st.close() }
                  } catch (_: Exception) {}
                  return out
              }

              fun device(c: Context, type: Int, s: Long, e: Long): Long = try {
                  val m = c.getSystemService(Context.NETWORK_STATS_SERVICE) as NetworkStatsManager
                  val b = m.querySummaryForDevice(type, subscriber(c, type), s, e)
                  b.rxBytes + b.txBytes
              } catch (_: Exception) { 0L }

              fun typeInt(n: String) =
                  if (n == "wifi") ConnectivityManager.TYPE_WIFI else ConnectivityManager.TYPE_MOBILE

              /** Live (non-stored) hourly buckets, used for the "Today" chart. */
              fun hourly(c: Context, s: Long, e: Long, n: Int): Pair<List<Long>, List<Long>> {
                  val step = (e - s) / n
                  val now = System.currentTimeMillis()
                  val w = ArrayList<Long>(); val m = ArrayList<Long>()
                  for (i in 0 until n) {
                      val a = s + i * step; val b = a + step
                      if (a > now) { w.add(0L); m.add(0L) }
                      else {
                          w.add(device(c, ConnectivityManager.TYPE_WIFI, a, b))
                          m.add(device(c, ConnectivityManager.TYPE_MOBILE, a, b))
                      }
                  }
                  return Pair(w, m)
              }

              // ---------------- time helpers ----------------
              fun dayStart(t: Long = System.currentTimeMillis()): Long {
                  val c = Calendar.getInstance(); c.timeInMillis = t
                  c.set(Calendar.HOUR_OF_DAY, 0); c.set(Calendar.MINUTE, 0)
                  c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0)
                  return c.timeInMillis
              }

              fun addDays(t: Long, n: Int): Long {
                  val c = Calendar.getInstance(); c.timeInMillis = t
                  c.add(Calendar.DAY_OF_YEAR, n)
                  return c.timeInMillis
              }

              fun nextDay(t: Long) = addDays(t, 1)

              /** Start of the current billing cycle (same maths as the Dart side). */
              fun cycleStart(c: Context, now: Long = System.currentTimeMillis()): Long {
                  val d = billingDay(c)
                  val cal = Calendar.getInstance(); cal.timeInMillis = now
                  if (cal.get(Calendar.DAY_OF_MONTH) < d) cal.add(Calendar.MONTH, -1)
                  cal.set(Calendar.DAY_OF_MONTH, d)
                  cal.set(Calendar.HOUR_OF_DAY, 0); cal.set(Calendar.MINUTE, 0)
                  cal.set(Calendar.SECOND, 0); cal.set(Calendar.MILLISECOND, 0)
                  return cal.timeInMillis
              }

              fun cycleEnd(start: Long): Long {
                  val cal = Calendar.getInstance(); cal.timeInMillis = start
                  cal.add(Calendar.MONTH, 1)
                  return cal.timeInMillis
              }

              fun periodStart(c: Context, p: String): Long = if (p == "month") cycleStart(c) else dayStart()
              fun periodEnd(p: String, start: Long): Long = if (p == "month") cycleEnd(start) else nextDay(start)

              // ---------------- formatting ----------------
              fun fmt(b: Long): String {
                  if (b < 1024) return "$b B"
                  val u = arrayOf("KB", "MB", "GB", "TB")
                  var v = b / 1024.0
                  var i = 0
                  while (v >= 1024 && i < 3) { v /= 1024; i++ }
                  val f = if (v >= 100) "%.0f %s" else if (v >= 10) "%.1f %s" else "%.2f %s"
                  return String.format(Locale.US, f, v, u[i])
              }

              fun appLabel(c: Context, pkg: String): String {
                  val pm = c.packageManager
                  return try { pm.getApplicationInfo(pkg, 0).loadLabel(pm).toString() } catch (_: Exception) { pkg }
              }

              // ---------------- notifications ----------------
              fun ensureChannels(c: Context) {
                  val nm = c.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CH_ALERTS, str(c, "ch_alerts", "Limit alerts"), NotificationManager.IMPORTANCE_HIGH))
                  nm.createNotificationChannel(
                      NotificationChannel(CH_SPEED, str(c, "ch_speed", "Live speed"), NotificationManager.IMPORTANCE_LOW))
              }

              /** Opens the screen where the user can restrict this app's data. */
              fun settingsIntent(c: Context, pkg: String): Intent {
                  val uri = Uri.parse("package:$pkg")
                  val i = Intent(Settings.ACTION_IGNORE_BACKGROUND_DATA_RESTRICTIONS_SETTINGS, uri)
                  val ok = i.resolveActivity(c.packageManager) != null
                  val r = if (ok) i else Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, uri)
                  return r.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }

              private fun alert(c: Context, pkg: String, level: Int, used: Long, limit: Long, willBlock: Boolean = false) {
                  val name = appLabel(c, pkg)
                  val nm = c.getSystemService(NotificationManager::class.java)
                  ensureChannels(c)
                  val pi = PendingIntent.getActivity(
                      c, pkg.hashCode(), settingsIntent(c, pkg),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val warn = level < 100
                  fun fill(s: String) = s.replace("{app}", name)
                      .replace("{pct}", (used * 100 / limit).toString())
                      .replace("{used}", fmt(used)).replace("{limit}", fmt(limit))
                  val blockedNow = willBlock && !warn
                  val title = fill(
                      if (warn) str(c, "wtitle", "{app}")
                      else if (blockedNow) str(c, "bk_title", "{app}")
                      else str(c, "atitle", "{app}")
                  )
                  val body = fill(
                      if (warn) str(c, "wbody")
                      else if (blockedNow) str(c, "bk_body")
                      else str(c, "abody")
                  )
                  val n = NotificationCompat.Builder(c, CH_ALERTS)
                      .setSmallIcon(R.drawable.ic_stat_speed)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                      .build()
                  try { nm.notify(pkg.hashCode(), n) } catch (_: Exception) {}
              }

              // ---------------- limits ----------------
              fun usedFor(c: Context, o: JSONObject, uid: Int, cache: HashMap<String, Map<Int, Use>>, now: Long): Long {
                  val start = periodStart(c, o.optString("period", "month"))
                  val net = o.optString("net", "mobile")
                  val nets = if (net == "all") listOf("wifi", "mobile") else listOf(net)
                  var used = 0L
                  for (n in nets) {
                      val map = cache.getOrPut("$n|$start") { usageByUid(c, typeInt(n), start, now) }
                      used += map[uid]?.total ?: 0L
                  }
                  return used
              }

              /** Alerts at 80 %, 100 % and then every extra 50 % (150, 200 ...), once per period. */
              fun checkLimits(c: Context) = synchronized(lock) { doCheck(c.applicationContext) }

              private fun doCheck(c: Context) {
                  val l = limits(c)
                  if (l.length() == 0) {
                      if (limitBlocked(c).isNotEmpty()) prefs(c).edit().remove("blocked").apply()
                      if (blockedSet(c).isNotEmpty() || BlockVpnService.active) applyBlocking(c)
                      return
                  }
                  if (!hasUsageAccess(c)) return
                  val now = System.currentTimeMillis()
                  val pm = c.packageManager
                  val cache = HashMap<String, Map<Int, Use>>()
                  val old = prefs(c).getStringSet("notified", emptySet()) ?: emptySet()
                  val cutoff = now - 70L * 86_400_000L
                  val done = HashSet<String>(old.filter { key -> (key.split("|").getOrNull(1)?.toLongOrNull() ?: 0L) > cutoff })
                  var changed = done.size != old.size
                  val blocked = limitBlocked(c)
                  val unb = prefs(c).getStringSet("unblock", emptySet()) ?: emptySet()
                  var blockChanged = false
                  val canBlock = canBlockNow(c)
                  for (pkg in l.keys()) {
                      try {
                          val o = l.getJSONObject(pkg)
                          val limit = o.getLong("bytes")
                          if (limit <= 0) continue
                          val uid = pm.getApplicationInfo(pkg, 0).uid
                          val used = usedFor(c, o, uid, cache, now)
                          val start = periodStart(c, o.optString("period", "month"))
                          val pct = (used * 100 / limit).toInt()
                          val level = when {
                              pct < 80 -> 0
                              pct < 100 -> 80
                              else -> 100 + (pct - 100) / 50 * 50
                          }
                          val willBlock = o.optBoolean("block", false) && used >= limit && !unb.contains("$pkg|$start")
                          if (willBlock) { if (blocked.add(pkg)) blockChanged = true }
                          else if (blocked.remove(pkg)) blockChanged = true
                          if (level > 0 && done.add("$pkg|$start|$level")) {
                              changed = true
                              alert(c, pkg, level, used, limit, willBlock && canBlock)
                          }
                      } catch (_: Exception) {}
                  }
                  for (p in blocked.toList()) if (!l.has(p)) { blocked.remove(p); blockChanged = true }
                  if (changed) prefs(c).edit().putStringSet("notified", done).apply()
                  if (blockChanged) prefs(c).edit().putStringSet("blocked", blocked).apply()
                  if (blockChanged || blockedSet(c).isNotEmpty() || BlockVpnService.active) applyBlocking(c)
              }

              // ---------------- app icons ----------------
              /** The app's launcher icon as a PNG (null when it can't be read). */
              fun iconPng(c: Context, pkg: String, px: Int = 96): ByteArray? = try {
                  val d = c.packageManager.getApplicationIcon(pkg)
                  val bmp = Bitmap.createBitmap(px, px, Bitmap.Config.ARGB_8888)
                  d.setBounds(0, 0, px, px)
                  d.draw(Canvas(bmp))
                  val out = ByteArrayOutputStream()
                  bmp.compress(Bitmap.CompressFormat.PNG, 100, out)
                  out.toByteArray()
              } catch (_: Throwable) { null }

              // ---------------- blocking (local VPN) ----------------
              /** Apps blocked because they reached their data limit (managed automatically). */
              fun limitBlocked(c: Context): MutableSet<String> =
                  HashSet<String>(prefs(c).getStringSet("blocked", emptySet()) ?: emptySet())

              /** Apps the user locked by hand: stay cut off until the user unlocks them. */
              fun lockedSet(c: Context): MutableSet<String> =
                  HashSet<String>(prefs(c).getStringSet("locked", emptySet()) ?: emptySet())

              /** Everything that must have no internet right now. */
              fun blockedSet(c: Context): MutableSet<String> {
                  val s = limitBlocked(c)
                  s.addAll(lockedSet(c))
                  return s
              }

              fun setLocked(c: Context, pkgs: Collection<String>, on: Boolean) {
                  val s = lockedSet(c)
                  if (on) s.addAll(pkgs) else s.removeAll(pkgs.toSet())
                  prefs(c).edit().putStringSet("locked", s).apply()
                  applyBlocking(c)
              }

              /** "skip" = never disconnect the user's own VPN, "take" = replace it. */
              fun vpnPolicy(c: Context): String = prefs(c).getString("vpn_policy", "skip") ?: "skip"

              fun vpnGranted(c: Context): Boolean = try { VpnService.prepare(c) == null } catch (_: Exception) { false }

              @Suppress("DEPRECATION")
              fun otherVpnActive(c: Context): Boolean {
                  if (BlockVpnService.active) return false
                  return try {
                      val cm = c.getSystemService(ConnectivityManager::class.java)
                      cm.allNetworks.any {
                          cm.getNetworkCapabilities(it)?.hasTransport(NetworkCapabilities.TRANSPORT_VPN) == true
                      }
                  } catch (_: Exception) { false }
              }

              private fun note(c: Context, id: Int, title: String, body: String) {
                  ensureChannels(c)
                  val pi = PendingIntent.getActivity(
                      c, id,
                      Intent(c, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = NotificationCompat.Builder(c, CH_ALERTS)
                      .setSmallIcon(R.drawable.ic_stat_speed)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                      .build()
                  try { c.getSystemService(NotificationManager::class.java).notify(id, n) } catch (_: Exception) {}
              }

              /** Blocking could not be enforced (permission missing / another VPN active): tell the user once a day per app. */
              private fun warnVpn(c: Context, blocked: Set<String>) {
                  val done = HashSet<String>(prefs(c).getStringSet("notified", emptySet()) ?: emptySet())
                  val day = dayStart()
                  var changed = false
                  for (pkg in blocked) {
                      if (!done.add("$pkg|$day|v")) continue
                      changed = true
                      val name = appLabel(c, pkg)
                      note(c, "v$pkg".hashCode(),
                          str(c, "bkv_title", "{app}").replace("{app}", name),
                          str(c, "bkv_body").replace("{app}", name))
                  }
                  if (changed) prefs(c).edit().putStringSet("notified", done).apply()
              }

              fun notifyRevoked(c: Context) {
                  val blocked = blockedSet(c)
                  if (blocked.isEmpty()) return
                  val names = blocked.joinToString(", ") { appLabel(c, it) }
                  note(c, 9001,
                      str(c, "bkv_title", "{app}").replace("{app}", names),
                      str(c, "bkv_body").replace("{app}", names))
              }

              /** Can we enforce blocking right now without surprising the user? */
              fun canBlockNow(c: Context): Boolean =
                  vpnGranted(c) && !(otherVpnActive(c) && vpnPolicy(c) != "take")

              /** Starts / refreshes / stops the blocker so it matches the "blocked" set. Safe to call from anywhere. */
              fun applyBlocking(c: Context) {
                  val ctx = c.applicationContext
                  val blocked = blockedSet(ctx)
                  if (blocked.isEmpty()) {
                      if (BlockVpnService.active) {
                          try { ctx.startService(Intent(ctx, BlockVpnService::class.java)) } catch (_: Exception) {}
                      }
                      return
                  }
                  if (!canBlockNow(ctx)) { warnVpn(ctx, blocked); return }
                  try { ctx.startService(Intent(ctx, BlockVpnService::class.java)) } catch (_: Exception) {}
              }

              /** Lifts the block on [pkg] until its current period ends. */
              fun unblock(c: Context, pkg: String) {
                  val o = limits(c).optJSONObject(pkg)
                  val start = periodStart(c, o?.optString("period", "month") ?: "month")
                  val un = HashSet<String>(prefs(c).getStringSet("unblock", emptySet()) ?: emptySet())
                  un.add("$pkg|$start")
                  val b = limitBlocked(c)
                  b.remove(pkg)
                  prefs(c).edit().putStringSet("unblock", un).putStringSet("blocked", b).apply()
                  applyBlocking(c)
              }

              // ---------------- background monitor ----------------
              fun setSpeed(c: Context, on: Boolean) {
                  prefs(c).edit().putBoolean("speed", on).apply()
                  val i = Intent(c, SpeedService::class.java)
                  try { if (on) c.startForegroundService(i) else c.stopService(i) } catch (_: Exception) {}
              }

              /** Inexact repeating alarm: records history + checks limits even when the app is closed. */
              fun scheduleMonitor(c: Context) {
                  val ctx = c.applicationContext
                  val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val pi = PendingIntent.getBroadcast(
                      ctx, 77, Intent(ctx, MonitorReceiver::class.java).setAction(MonitorReceiver.TICK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  am.setInexactRepeating(
                      AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 60_000L,
                      AlarmManager.INTERVAL_FIFTEEN_MINUTES, pi
                  )
                  NetLog.register(ctx)
              }
          }

          // ---------------------------------------------------------------- History
          /** Local daily history (per app, per day) so long periods are not limited by Android's retention. */
          object History {
              const val TOTAL = "*"
              private const val NET_SQL = "CREATE TABLE IF NOT EXISTS netuse(day INTEGER NOT NULL, net TEXT NOT NULL, " +
                  "pkg TEXT NOT NULL, bytes INTEGER NOT NULL, PRIMARY KEY(day, net, pkg))"
              private val running = AtomicBoolean(false)
              private var helper: Helper? = null

              private class Helper(c: Context) : SQLiteOpenHelper(c.applicationContext, "history.db", null, 2) {
                  override fun onCreate(db: SQLiteDatabase) {
                      db.execSQL(
                          "CREATE TABLE daily(day INTEGER NOT NULL, pkg TEXT NOT NULL, " +
                              "wifi INTEGER NOT NULL, mobile INTEGER NOT NULL, PRIMARY KEY(day, pkg))"
                      )
                      db.execSQL(NET_SQL)
                  }
                  override fun onUpgrade(db: SQLiteDatabase, o: Int, n: Int) { db.execSQL(NET_SQL) }
              }

              @Synchronized
              private fun db(c: Context): SQLiteDatabase {
                  val h = helper ?: Helper(c).also { helper = it }
                  return h.writableDatabase
              }

              fun pkgOf(pm: PackageManager, uid: Int): String {
                  if (uid < 0) return "uid:$uid"
                  val p = try { pm.getPackagesForUid(uid)?.firstOrNull() } catch (_: Exception) { null }
                  if (p != null) return p
                  val n = try { pm.getNameForUid(uid) } catch (_: Exception) { null }
                  if (n != null && !n.contains(':')) return n
                  return "uid:$uid"
              }

              // ---------------- writing ----------------
              private fun syncDay(c: Context, start: Long) {
                  if (!Core.hasUsageAccess(c)) return
                  val end = Core.nextDay(start)
                  val w = Core.usageByUid(c, ConnectivityManager.TYPE_WIFI, start, end)
                  val m = Core.usageByUid(c, ConnectivityManager.TYPE_MOBILE, start, end)
                  val pm = c.packageManager
                  val rows = HashMap<String, LongArray>()
                  for ((uid, u) in w) rows.getOrPut(pkgOf(pm, uid)) { LongArray(2) }[0] += u.total
                  for ((uid, u) in m) rows.getOrPut(pkgOf(pm, uid)) { LongArray(2) }[1] += u.total
                  rows[TOTAL] = longArrayOf(
                      Core.device(c, ConnectivityManager.TYPE_WIFI, start, end),
                      Core.device(c, ConnectivityManager.TYPE_MOBILE, start, end)
                  )
                  synchronized(this) {
                      val d = db(c)
                      // never lower a stored value (protects from transient query failures)
                      val old = HashMap<String, LongArray>()
                      d.rawQuery("SELECT pkg, wifi, mobile FROM daily WHERE day=?", arrayOf(start.toString())).use {
                          while (it.moveToNext()) old[it.getString(0)] = longArrayOf(it.getLong(1), it.getLong(2))
                      }
                      d.beginTransaction()
                      try {
                          for ((k, v) in rows) {
                              old[k]?.let { o -> v[0] = maxOf(v[0], o[0]); v[1] = maxOf(v[1], o[1]) }
                              if (k != TOTAL && v[0] + v[1] == 0L) continue
                              val cv = ContentValues()
                              cv.put("day", start); cv.put("pkg", k); cv.put("wifi", v[0]); cv.put("mobile", v[1])
                              d.insertWithOnConflict("daily", null, cv, SQLiteDatabase.CONFLICT_REPLACE)
                          }
                          d.setTransactionSuccessful()
                      } finally { d.endTransaction() }
                  }
              }

              /** Fast: today + yesterday only. Called before every read from the UI. */
              fun syncRecent(c: Context) {
                  val t = Core.dayStart()
                  syncDay(c, Core.addDays(t, -1))
                  syncDay(c, t)
              }

              /** Full / incremental sync (back-fills up to 90 days on first run). */
              fun sync(c: Context) {
                  if (!Core.hasUsageAccess(c)) return
                  if (!running.compareAndSet(false, true)) return
                  try {
                      val p = Core.prefs(c)
                      val today = Core.dayStart()
                      val earliest = Core.addDays(today, -89)
                      val last = p.getLong("hist_last", 0L)
                      var d = if (last == 0L) earliest else maxOf(earliest, Core.nextDay(last))
                      while (d <= today) {
                          syncDay(c, d)
                          if (d < today) p.edit().putLong("hist_last", d).apply()
                          d = Core.nextDay(d)
                      }
                  } finally { running.set(false) }
              }

              fun resync(c: Context) {
                  Core.prefs(c).edit().remove("hist_last").apply()
                  sync(c)
              }

              // ---------------- reading ----------------
              fun pkgTotals(c: Context, pkg: String, s: Long, e: Long): LongArray {
                  val out = LongArray(2)
                  db(c).rawQuery(
                      "SELECT SUM(wifi), SUM(mobile) FROM daily WHERE pkg=? AND day>=? AND day<?",
                      arrayOf(pkg, s.toString(), e.toString())
                  ).use { if (it.moveToFirst()) { out[0] = it.getLong(0); out[1] = it.getLong(1) } }
                  return out
              }

              fun totals(c: Context, s: Long, e: Long) = pkgTotals(c, TOTAL, s, e)

              fun addNet(c: Context, day: Long, rows: Map<String, Long>) {
                  synchronized(this) {
                      val d = db(c)
                      d.beginTransaction()
                      try {
                          for ((k, v) in rows) {
                              val i = k.lastIndexOf('|')          // the Wi-Fi name may contain '|', the package never does
                              val net = k.substring(0, i)
                              val pkg = k.substring(i + 1)
                              d.execSQL("INSERT OR IGNORE INTO netuse(day, net, pkg, bytes) VALUES(?,?,?,0)", arrayOf<Any>(day, net, pkg))
                              d.execSQL("UPDATE netuse SET bytes = bytes + ? WHERE day=? AND net=? AND pkg=?", arrayOf<Any>(v, day, net, pkg))
                          }
                          d.setTransactionSuccessful()
                      } finally { d.endTransaction() }
                  }
              }

              fun netTotals(c: Context, s: Long, e: Long): List<Pair<String, Long>> {
                  val out = ArrayList<Pair<String, Long>>()
                  db(c).rawQuery(
                      "SELECT net, SUM(bytes) FROM netuse WHERE day>=? AND day<? GROUP BY net ORDER BY 2 DESC",
                      arrayOf(s.toString(), e.toString())
                  ).use { while (it.moveToNext()) out.add(Pair(it.getString(0), it.getLong(1))) }
                  return out
              }

              fun netApps(c: Context, net: String, s: Long, e: Long): List<Pair<String, Long>> {
                  val out = ArrayList<Pair<String, Long>>()
                  db(c).rawQuery(
                      "SELECT pkg, SUM(bytes) FROM netuse WHERE net=? AND day>=? AND day<? GROUP BY pkg ORDER BY 2 DESC",
                      arrayOf(net, s.toString(), e.toString())
                  ).use { while (it.moveToNext()) out.add(Pair(it.getString(0), it.getLong(1))) }
                  return out
              }

              /** Start of the earliest day stored in the history (0 when nothing is stored yet). */
              fun firstDay(c: Context): Long {
                  val first = db(c).rawQuery("SELECT MIN(day) FROM daily", null).use { cur ->
                      if (cur.moveToFirst()) cur.getLong(0) else 0L
                  }
                  return first
              }

              fun perPkg(c: Context, s: Long, e: Long): Map<String, LongArray> {
                  val out = HashMap<String, LongArray>()
                  db(c).rawQuery(
                      "SELECT pkg, SUM(wifi), SUM(mobile) FROM daily WHERE day>=? AND day<? AND pkg<>? GROUP BY pkg",
                      arrayOf(s.toString(), e.toString(), TOTAL)
                  ).use { while (it.moveToNext()) out[it.getString(0)] = longArrayOf(it.getLong(1), it.getLong(2)) }
                  return out
              }

              /** Daily rows folded into n equal buckets between s and e. */
              fun series(c: Context, pkg: String, s: Long, e: Long, n: Int): Pair<List<Long>, List<Long>> {
                  val w = LongArray(n); val m = LongArray(n)
                  val span = (e - s).coerceAtLeast(1L)
                  db(c).rawQuery(
                      "SELECT day, wifi, mobile FROM daily WHERE pkg=? AND day>=? AND day<?",
                      arrayOf(pkg, s.toString(), e.toString())
                  ).use {
                      while (it.moveToNext()) {
                          val i = ((it.getLong(0) - s) * n / span).toInt().coerceIn(0, n - 1)
                          w[i] += it.getLong(1); m[i] += it.getLong(2)
                      }
                  }
                  return Pair(w.toList(), m.toList())
              }

              // ---------------- export ----------------
              private fun q(s: String) = "\"" + s.replace("\"", "\"\"") + "\""

              fun exportCsv(c: Context, s: Long, e: Long): File {
                  val dir = File(c.cacheDir, "exports").apply { mkdirs() }
                  val f = File(dir, "dataly_usage.csv")
                  val names = HashMap<String, String>()
                  val df = SimpleDateFormat("yyyy-MM-dd", Locale.US)
                  f.bufferedWriter(Charsets.UTF_8).use { w ->
                      w.write("\uFEFF")
                      w.write("date,app,package,wifi_bytes,mobile_bytes\n")
                      db(c).rawQuery(
                          "SELECT day, pkg, wifi, mobile FROM daily WHERE day>=? AND day<? ORDER BY day, pkg",
                          arrayOf(s.toString(), e.toString())
                      ).use {
                          while (it.moveToNext()) {
                              val pkg = it.getString(1)
                              val name = when {
                                  pkg == TOTAL -> "TOTAL"
                                  pkg.startsWith("uid:") -> pkg
                                  else -> names.getOrPut(pkg) { Core.appLabel(c, pkg) }
                              }
                              val pk = if (pkg == TOTAL) "" else pkg
                              w.write("${df.format(Date(it.getLong(0)))},${q(name)},${q(pk)},${it.getLong(2)},${it.getLong(3)}\n")
                          }
                      }
                  }
                  return f
              }
          }

          // ---------------------------------------------------------------- NetLog
          /**
           * Per-network usage. Android has no public per-Wi-Fi statistics, so Dataly records time segments:
           * every segment is attributed to the Wi-Fi / mobile network that was connected during it.
           * A network-change callback (PendingIntent) closes the segment at the moment you switch networks.
           */
          object NetLog {
              private val lock = Any()
              private const val UNKNOWN = "?"

              /** (connected, ssid or "" when hidden, networkId) */
              @Suppress("DEPRECATION")
              fun wifiInfo(c: Context): Triple<Boolean, String, Int> {
                  return try {
                      val cm = c.getSystemService(ConnectivityManager::class.java)
                      val connected = cm.allNetworks.any {
                          cm.getNetworkCapabilities(it)?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true
                      }
                      if (!connected) return Triple(false, "", -1)
                      val wm = c.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      val info = wm.connectionInfo
                      val id = info?.networkId ?: -1
                      var ssid = (info?.ssid ?: "").trim('"')
                      if (ssid == "<unknown ssid>" || ssid == "0x") ssid = ""
                      val p = Core.prefs(c)
                      if (ssid.isNotEmpty()) {
                          if (id >= 0) p.edit().putString("ssid_$id", ssid).apply()   // remember it for background ticks
                      } else if (id >= 0) {
                          ssid = p.getString("ssid_$id", "") ?: ""
                      }
                      Triple(true, ssid, id)
                  } catch (_: Exception) { Triple(false, "", -1) }
              }

              fun mobileName(c: Context): String = try {
                  val tm = c.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                  val n = tm.networkOperatorName
                  if (!n.isNullOrBlank()) n else (tm.simOperatorName ?: "")
              } catch (_: Exception) { "" }

              /** Listen for network changes even when the app is closed. Safe to call repeatedly. */
              fun register(c: Context) {
                  try {
                      val cm = c.getSystemService(ConnectivityManager::class.java)
                      val req = NetworkRequest.Builder().addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET).build()
                      val pi = PendingIntent.getBroadcast(
                          c, 78, Intent(c, MonitorReceiver::class.java).setAction(MonitorReceiver.NET),
                          PendingIntent.FLAG_MUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      cm.registerNetworkCallback(req, pi)
                  } catch (_: Exception) {}
              }

              fun tick(c: Context, force: Boolean = false) = synchronized(lock) { doTick(c.applicationContext, force) }

              private fun doTick(c: Context, force: Boolean) {
                  if (!Core.hasUsageAccess(c)) return
                  val p = Core.prefs(c)
                  val now = System.currentTimeMillis()
                  val (wc, wname, wid) = wifiInfo(c)
                  val prevW = p.getString("nl_w", "") ?: ""
                  val prevM = p.getString("nl_m", "") ?: ""
                  var wkey = if (!wc) "" else "w:" + wname.ifEmpty { UNKNOWN }
                  // name hidden right now but it is the same Wi-Fi as before -> keep the known name
                  if (wc && wname.isEmpty() && wid >= 0 && wid == p.getInt("nl_wid", -2) && prevW.startsWith("w:")) wkey = prevW
                  val mkey = "m:" + mobileName(c).ifEmpty { UNKNOWN }
                  val last = p.getLong("nl_t", 0L)
                  fun save() = p.edit().putLong("nl_t", now).putString("nl_w", wkey).putString("nl_m", mkey).putInt("nl_wid", wid).apply()
                  if (last == 0L) { save(); return }
                  val changed = wkey != prevW || mkey != prevM
                  if (!changed && !force && now - last < 5 * 60_000L) return
                  closeSegment(c, maxOf(last, now - 7L * 86_400_000L), now, prevW, prevM)
                  save()
              }

              private fun closeSegment(c: Context, t0: Long, t1: Long, wkey: String, mkey: String) {
                  var a = t0
                  while (a < t1) {
                      val day = Core.dayStart(a)
                      val b = minOf(Core.nextDay(day), t1)
                      attribute(c, day, a, b, wkey.ifEmpty { "w:$UNKNOWN" }, mkey.ifEmpty { "m:$UNKNOWN" })
                      a = b
                  }
              }

              private fun attribute(c: Context, day: Long, a: Long, b: Long, wkey: String, mkey: String) {
                  val pm = c.packageManager
                  val rows = HashMap<String, Long>()
                  fun add(net: String, pkg: String, v: Long) { if (v > 0) rows["$net|$pkg"] = (rows["$net|$pkg"] ?: 0L) + v }
                  for ((uid, u) in Core.usageByUid(c, ConnectivityManager.TYPE_WIFI, a, b)) add(wkey, History.pkgOf(pm, uid), u.total)
                  for ((uid, u) in Core.usageByUid(c, ConnectivityManager.TYPE_MOBILE, a, b)) add(mkey, History.pkgOf(pm, uid), u.total)
                  if (rows.isNotEmpty()) History.addNet(c, day, rows)
              }
          }

          // ---------------------------------------------------------------- SpeedService
          /** Live speed notification. While running it also checks limits every ~30 s. */
          class SpeedService : Service() {
              private val h = Handler(Looper.getMainLooper())
              private var lastRx = -1L
              private var lastTx = -1L
              private var lastT = 0L
              private var ticks = 0

              private val loop = object : Runnable {
                  override fun run() {
                      tick()
                      h.postDelayed(this, 1000)
                  }
              }

              private fun spd(b: Double): String = when {
                  b >= 1_048_576 -> String.format(Locale.US, "%.2f MB/s", b / 1_048_576)
                  b >= 1024 -> String.format(Locale.US, "%.0f KB/s", b / 1024)
                  else -> String.format(Locale.US, "%.0f B/s", b)
              }

              private fun build(down: Double, up: Double): Notification =
                  NotificationCompat.Builder(this, Core.CH_SPEED)
                      .setSmallIcon(R.drawable.ic_stat_speed)
                      .setContentTitle("↓ ${spd(down)}    ↑ ${spd(up)}")
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setContentIntent(
                          android.app.PendingIntent.getActivity(
                              this, 0, Intent(this, MainActivity::class.java),
                              android.app.PendingIntent.FLAG_IMMUTABLE or android.app.PendingIntent.FLAG_UPDATE_CURRENT
                          )
                      )
                      .build()

              private fun tick() {
                  val rx = TrafficStats.getTotalRxBytes()
                  val tx = TrafficStats.getTotalTxBytes()
                  val t = SystemClock.elapsedRealtime()
                  if (rx >= 0 && tx >= 0) {
                      if (lastT > 0 && lastRx >= 0) {
                          val dt = ((t - lastT) / 1000.0).coerceAtLeast(0.001)
                          val d = (rx - lastRx).coerceAtLeast(0L) / dt
                          val u = (tx - lastTx).coerceAtLeast(0L) / dt
                          try {
                              getSystemService(NotificationManager::class.java).notify(1, build(d, u))
                          } catch (_: Exception) {}
                      }
                      lastRx = rx; lastTx = tx; lastT = t
                  }
                  if (++ticks % 30 == 0) {
                      val ctx = applicationContext
                      Thread { Core.checkLimits(ctx) }.start()
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  Core.ensureChannels(this)
                  val n = build(0.0, 0.0)
                  if (Build.VERSION.SDK_INT >= 34)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else
                      startForeground(1, n)
                  h.removeCallbacks(loop)
                  lastT = 0L; lastRx = -1L; lastTx = -1L
                  h.post(loop)
                  return START_STICKY
              }

              override fun onDestroy() {
                  h.removeCallbacks(loop)
                  super.onDestroy()
              }

              override fun onBind(i: Intent?): IBinder? = null
          }

          // ---------------------------------------------------------------- MonitorReceiver
          /** Periodic alarm tick + boot/update handler. */
          class MonitorReceiver : BroadcastReceiver() {
              companion object {
                  const val TICK = "com.dataly.app.TICK"
                  const val NET = "com.dataly.app.NET"
              }

              override fun onReceive(c: Context, i: Intent?) {
                  val ctx = c.applicationContext
                  when (i?.action) {
                      Intent.ACTION_BOOT_COMPLETED, Intent.ACTION_MY_PACKAGE_REPLACED -> {
                          Core.scheduleMonitor(ctx)
                          if (Core.prefs(ctx).getBoolean("speed", false)) Core.setSpeed(ctx, true)
                          work(ctx)
                      }
                      TICK -> work(ctx)
                      NET -> netChanged(ctx)
                  }
              }

              /** The connected network changed: close the usage segment of the previous one. */
              private fun netChanged(ctx: Context) {
                  val p = goAsync()
                  Thread {
                      try { NetLog.tick(ctx) } catch (_: Throwable) {} finally { p.finish() }
                  }.start()
              }

              private fun work(ctx: Context) {
                  val p = goAsync()
                  Thread {
                      try {
                          if (Core.hasUsageAccess(ctx)) {
                              NetLog.tick(ctx)
                              History.sync(ctx)
                              Core.checkLimits(ctx)
                              DatalyWidget.refresh(ctx)
                          }
                          Core.applyBlocking(ctx)
                      } catch (_: Throwable) {
                      } finally { p.finish() }
                  }.start()
              }
          }

          // ---------------------------------------------------------------- SpeedTile
          /** Quick Settings tile that toggles the live-speed notification. */
          class SpeedTile : TileService() {
              override fun onStartListening() = refresh()

              override fun onClick() {
                  val on = !Core.prefs(this).getBoolean("speed", false)
                  Core.setSpeed(this, on)
                  refresh()
              }

              private fun refresh() {
                  val t = qsTile ?: return
                  t.state = if (Core.prefs(this).getBoolean("speed", false)) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE
                  t.label = Core.str(this, "tile", "Live speed")
                  t.updateTile()
              }
          }

          // ---------------------------------------------------------------- DatalyWidget
          /** Home-screen widget: today + current billing cycle, Wi-Fi vs mobile. */
          class DatalyWidget : AppWidgetProvider() {
              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) {
                  val ctx = c.applicationContext
                  val p = goAsync()
                  Thread {
                      try {
                          History.syncRecent(ctx)
                          for (id in ids) m.updateAppWidget(id, build(ctx))
                      } catch (_: Throwable) {
                      } finally { p.finish() }
                  }.start()
              }

              companion object {
                  fun build(c: Context): RemoteViews {
                      val v = RemoteViews(c.packageName, R.layout.widget_usage)
                      val today = Core.dayStart()
                      val t = History.totals(c, today, Core.nextDay(today))
                      val cs = Core.cycleStart(c)
                      val m = History.totals(c, cs, Core.cycleEnd(cs))
                      val wifi = Core.str(c, "wifi", "Wi-Fi")
                      val mob = Core.str(c, "mobile", "Mobile")
                      v.setTextViewText(R.id.w_today_label, Core.str(c, "today", "Today"))
                      v.setTextViewText(R.id.w_today_wifi, "$wifi  ${Core.fmt(t[0])}")
                      v.setTextViewText(R.id.w_today_mob, "$mob  ${Core.fmt(t[1])}")
                      v.setTextViewText(R.id.w_cycle_label, Core.str(c, "month", "Month"))
                      v.setTextViewText(R.id.w_cycle_wifi, "$wifi  ${Core.fmt(m[0])}")
                      v.setTextViewText(R.id.w_cycle_mob, "$mob  ${Core.fmt(m[1])}")
                      val pi = PendingIntent.getActivity(
                          c, 1, Intent(c, MainActivity::class.java),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      v.setOnClickPendingIntent(R.id.w_root, pi)
                      return v
                  }

                  fun refresh(c: Context) {
                      try {
                          val mgr = AppWidgetManager.getInstance(c)
                          val ids = mgr.getAppWidgetIds(ComponentName(c, DatalyWidget::class.java))
                          if (ids.isEmpty()) return
                          val rv = build(c)
                          for (id in ids) mgr.updateAppWidget(id, rv)
                      } catch (_: Throwable) {}
                  }
              }
          }

          // ---------------------------------------------------------------- BlockVpnService
          /**
           * Local "black-hole" VPN. Only the blocked apps are routed into the tunnel (addAllowedApplication);
           * every packet they send is read and dropped, so they have no internet. All other apps are untouched.
           * The tunnel exists only while at least one app is blocked, so it does not hold the VPN slot otherwise.
           */
          class BlockVpnService : VpnService() {
              companion object { @Volatile var active = false }

              private var pfd: ParcelFileDescriptor? = null
              private var current: Set<String> = emptySet()

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val want = Core.blockedSet(this)
                  if (want.isEmpty()) { teardown(); stopSelf(); return START_NOT_STICKY }
                  if (pfd == null || want != current) establishFor(want)
                  return START_STICKY
              }

              private fun establishFor(want: Set<String>) {
                  teardown()
                  val b = Builder()
                      .setSession("Dataly")
                      .addAddress("10.255.0.2", 32)
                      .addAddress("fd00:da7a::2", 128)
                      .addRoute("0.0.0.0", 0)
                      .addRoute("::", 0)
                      .setMtu(1500)
                      .setBlocking(true)
                  var n = 0
                  for (p in want) { try { b.addAllowedApplication(p); n++ } catch (_: Exception) {} }
                  if (n == 0) { stopSelf(); return }
                  val f = try { b.establish() } catch (_: Exception) { null } ?: return
                  pfd = f
                  current = HashSet<String>(want)
                  active = true
                  Thread { drain(f) }.apply { isDaemon = true; start() }
              }

              private fun drain(f: ParcelFileDescriptor) {
                  val input = FileInputStream(f.fileDescriptor)
                  val buf = ByteArray(32767)
                  try { while (input.read(buf) >= 0) { /* drop every packet */ } } catch (_: Exception) {}
              }

              private fun teardown() {
                  active = false
                  try { pfd?.close() } catch (_: Exception) {}
                  pfd = null
                  current = emptySet()
              }

              // Another VPN app took over the VPN slot.
              override fun onRevoke() {
                  teardown()
                  Core.notifyRevoked(this)
                  stopSelf()
                  super.onRevoke()
              }

              override fun onDestroy() {
                  teardown()
                  super.onDestroy()
              }
          }

          // ---------------------------------------------------------------- MainActivity
          class MainActivity : FlutterActivity() {
              private var pendingVpn: MethodChannel.Result? = null
              private val iconExec = Executors.newFixedThreadPool(3)

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 4711) {
                      val r = pendingVpn
                      pendingVpn = null
                      val ok = resultCode == RESULT_OK
                      try { r?.success(ok) } catch (_: Exception) {}
                      if (ok) { val ctx = applicationContext; Thread { Core.applyBlocking(ctx) }.start() }
                      return
                  }
                  super.onActivityResult(requestCode, resultCode, data)
              }

              /** Runs [f] on a worker thread; always answers the channel (success or error, never null-on-failure). */
              private fun bg(res: MethodChannel.Result, f: () -> Any?) {
                  Thread {
                      var out: Any? = null
                      var err: Exception? = null
                      try { out = f() } catch (x: Exception) { err = x }
                      val ex = err
                      val r = out
                      runOnUiThread {
                          try {
                              if (ex != null) res.error("native", ex.message, null) else res.success(r)
                          } catch (_: Exception) {}
                      }
                  }.start()
              }

              private fun shareFile(f: File) {
                  val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", f)
                  val i = Intent(Intent.ACTION_SEND)
                      .setType("text/csv")
                      .putExtra(Intent.EXTRA_STREAM, uri)
                      .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  startActivity(Intent.createChooser(i, null))
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "dataly/native")
                      .setMethodCallHandler { call, res ->
                          val ctx = applicationContext
                          val s = call.argument<Number>("s")?.toLong() ?: 0L
                          val e = call.argument<Number>("e")?.toLong() ?: 0L
                          val n = call.argument<Int>("n") ?: 7

                          when (call.method) {
                              "hasAccess" -> res.success(Core.hasUsageAccess(ctx))

                              "openAccess" -> {
                                  try {
                                      val i = Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)
                                      if (Build.VERSION.SDK_INT >= 29) i.data = Uri.parse("package:$packageName")
                                      startActivity(i)
                                  } catch (_: ActivityNotFoundException) {
                                      startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                                  }
                                  res.success(null)
                              }

                              "openAppData" -> {
                                  val pkg = call.argument<String>("pkg") ?: ""
                                  try { startActivity(Core.settingsIntent(this, pkg)) } catch (_: Exception) {}
                                  res.success(null)
                              }

                              "state" -> {
                                  val p = Core.prefs(ctx)
                                  res.success(mapOf(
                                      "limits" to (p.getString("limits", "{}") ?: "{}"),
                                      "speed" to p.getBoolean("speed", false),
                                      "lang" to (p.getString("lang", "") ?: ""),
                                      "bill" to Core.billingDay(ctx),
                                      "vpn_policy" to Core.vpnPolicy(ctx),
                                      "vpn_consent" to p.getBoolean("vpn_consent", false),
                                      "hist_start" to History.firstDay(ctx),
                                      "locked" to Core.lockedSet(ctx).toList(),
                                      "sdk" to Build.VERSION.SDK_INT
                                  ))
                              }

                              "setLang" -> {
                                  val ed = Core.prefs(ctx).edit()
                                      .putString("lang", call.argument<String>("lang") ?: "en")
                                  (call.argument<Map<String, Any?>>("strs") ?: emptyMap()).forEach { (k, v) ->
                                      ed.putString("s_$k", v?.toString() ?: "")
                                  }
                                  ed.apply()
                                  Core.ensureChannels(ctx)
                                  DatalyWidget.refresh(ctx)
                                  res.success(null)
                              }

                              "setBilling" -> {
                                  Core.prefs(ctx).edit()
                                      .putInt("bill", (call.argument<Int>("day") ?: 1).coerceIn(1, 28))
                                      .remove("notified").apply()
                                  DatalyWidget.refresh(ctx)
                                  Thread { Core.checkLimits(ctx) }.start()
                                  res.success(null)
                              }

                              "save" -> {
                                  Core.prefs(ctx).edit()
                                      .putString("limits", call.argument<String>("json") ?: "{}")
                                      .remove("notified").apply()
                                  Core.scheduleMonitor(ctx)
                                  Thread { Core.checkLimits(ctx) }.start()
                                  res.success(null)
                              }

                              "speed" -> {
                                  Core.setSpeed(ctx, call.argument<Boolean>("on") ?: false)
                                  res.success(null)
                              }

                              "startMonitor" -> {
                                  Core.scheduleMonitor(ctx)
                                  Thread { NetLog.tick(ctx, true); History.sync(ctx); Core.checkLimits(ctx); DatalyWidget.refresh(ctx); Core.applyBlocking(ctx) }.start()
                                  res.success(null)
                              }

                              "resync" -> {
                                  Thread { History.resync(ctx) }.start()
                                  res.success(null)
                              }

                              "load" -> bg(res) {
                                  val hourly = call.argument<Boolean>("hourly") ?: false
                                  History.syncRecent(ctx)
                                  val tot = History.totals(ctx, s, e)
                                  val (sw, sm) = if (hourly) Core.hourly(ctx, s, e, n)
                                                 else History.series(ctx, History.TOTAL, s, e, n)
                                  val usage = History.perPkg(ctx, s, e).map { (k, v) ->
                                      val isUid = k.startsWith("uid:")
                                      mapOf(
                                          "pkg" to k,
                                          "uid" to (if (isUid) (k.substring(4).toIntOrNull() ?: 0) else 0),
                                          "name" to (if (isUid) "" else Core.appLabel(ctx, k)),
                                          "wifi" to v[0],
                                          "mobile" to v[1]
                                      )
                                  }
                                  mapOf("wifi" to tot[0], "mobile" to tot[1], "swifi" to sw, "smobile" to sm, "usage" to usage)
                              }

                              "detail" -> bg(res) {
                                  val pkg = call.argument<String>("pkg") ?: ""
                                  History.syncRecent(ctx)
                                  val (w, m) = History.series(ctx, pkg, s, e, n)
                                  val tot = History.pkgTotals(ctx, pkg, s, e)
                                  val now = System.currentTimeMillis()
                                  val uid = try { packageManager.getApplicationInfo(pkg, 0).uid } catch (_: Exception) { -1 }
                                  val uw = Core.usageByUid(ctx, ConnectivityManager.TYPE_WIFI, s, now)[uid]
                                  val um = Core.usageByUid(ctx, ConnectivityManager.TYPE_MOBILE, s, now)[uid]
                                  val live = (uw?.total ?: 0L) + (um?.total ?: 0L)
                                  val fg = (uw?.fg ?: 0L) + (um?.fg ?: 0L)
                                  mapOf(
                                      "wifi" to tot[0], "mobile" to tot[1],
                                      "fg" to fg, "bg" to (live - fg).coerceAtLeast(0L),
                                      "swifi" to w, "smobile" to m
                                  )
                              }

                              "apps" -> bg(res) {
                                  val pm = packageManager
                                  val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                                  @Suppress("DEPRECATION")
                                  val list = pm.queryIntentActivities(q, 0)
                                  list.map { it.activityInfo.packageName to it.loadLabel(pm).toString() }
                                      .filter { it.first != packageName }
                                      .distinctBy { it.first }
                                      .sortedBy { it.second.lowercase() }
                                      .map { mapOf("pkg" to it.first, "name" to it.second) }
                              }

                              "limitStatus" -> bg(res) {
                                  val l = Core.limits(ctx)
                                  val now = System.currentTimeMillis()
                                  val cache = HashMap<String, Map<Int, Core.Use>>()
                                  val out = HashMap<String, Any>()
                                  for (pkg in l.keys()) {
                                      try {
                                          val o = l.getJSONObject(pkg)
                                          val per = o.optString("period", "month")
                                          val uid = packageManager.getApplicationInfo(pkg, 0).uid
                                          val st = Core.periodStart(ctx, per)
                                          out[pkg] = mapOf(
                                              "used" to Core.usedFor(ctx, o, uid, cache, now),
                                              "start" to st,
                                              "end" to Core.periodEnd(per, st),
                                              "blocked" to Core.limitBlocked(ctx).contains(pkg)
                                          )
                                      } catch (_: Exception) {}
                                  }
                                  out
                              }

                              "netNow" -> bg(res) {
                                  val (wc, wn, _) = NetLog.wifiInfo(ctx)
                                  val fine = ctx.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                                  val locOn = try { LocationManagerCompat.isLocationEnabled(ctx.getSystemService(LocationManager::class.java)) } catch (_: Exception) { true }
                                  mapOf("wifiConnected" to wc, "wifiName" to wn, "mobile" to NetLog.mobileName(ctx), "fine" to fine, "locOn" to locOn)
                              }

                              "netUsage" -> bg(res) {
                                  NetLog.tick(ctx, true)
                                  History.netTotals(ctx, s, e).map { mapOf("net" to it.first, "bytes" to it.second) }
                              }

                              "netApps" -> bg(res) {
                                  val net = call.argument<String>("net") ?: ""
                                  History.netApps(ctx, net, s, e).map { (pkg, bytes) ->
                                      val isUid = pkg.startsWith("uid:")
                                      mapOf(
                                          "pkg" to pkg,
                                          "uid" to (if (isUid) (pkg.substring(4).toIntOrNull() ?: 0) else 0),
                                          "name" to (if (isUid) "" else Core.appLabel(ctx, pkg)),
                                          "bytes" to bytes
                                      )
                                  }
                              }

                              "openLocationSettings" -> {
                                  try { startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)) } catch (_: Exception) {}
                                  res.success(null)
                              }

                              "setConsent" -> {
                                  Core.prefs(ctx).edit().putBoolean("vpn_consent", true).apply()
                                  res.success(null)
                              }

                              "setLocked" -> {
                                  val pkgs = call.argument<List<String>>("pkgs") ?: emptyList()
                                  val on = call.argument<Boolean>("on") ?: false
                                  Thread { Core.setLocked(ctx, pkgs, on) }.start()
                                  res.success(null)
                              }

                              "icon" -> {
                                  val pkg = call.argument<String>("pkg") ?: ""
                                  iconExec.execute {
                                      val b = Core.iconPng(ctx, pkg)
                                      runOnUiThread { try { res.success(b) } catch (_: Exception) {} }
                                  }
                              }

                              "vpnState" -> bg(res) {
                                  mapOf(
                                      "granted" to Core.vpnGranted(ctx),
                                      "active" to BlockVpnService.active,
                                      "other" to Core.otherVpnActive(ctx),
                                      "policy" to Core.vpnPolicy(ctx)
                                  )
                              }

                              "prepareVpn" -> {
                                  val i = VpnService.prepare(this)
                                  if (i == null) res.success(true)
                                  else {
                                      pendingVpn?.let { try { it.success(false) } catch (_: Exception) {} }
                                      pendingVpn = res
                                      try { startActivityForResult(i, 4711) }
                                      catch (_: Exception) { pendingVpn = null; res.success(false) }
                                  }
                              }

                              "setVpnPolicy" -> {
                                  Core.prefs(ctx).edit().putString("vpn_policy", call.argument<String>("p") ?: "skip").apply()
                                  Thread { Core.applyBlocking(ctx) }.start()
                                  res.success(null)
                              }

                              "unblock" -> {
                                  val pkg = call.argument<String>("pkg") ?: ""
                                  Thread { Core.unblock(ctx, pkg) }.start()
                                  res.success(null)
                              }

                              "export" -> bg(res) {
                                  val f = History.exportCsv(ctx, s, e)
                                  runOnUiThread { try { shareFile(f) } catch (_: Exception) {} }
                                  true
                              }

                              else -> res.notImplemented()
                          }
                      }
              }
          }
          EOF

