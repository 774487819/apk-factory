          // models.dart
          // ======================================================================
          /// Plain data classes and period maths shared by the UI.

          class AppUse {
            final String pkg, name;
            final int uid;
            final num wifi, mobile;
            const AppUse(this.pkg, this.name, this.uid, this.wifi, this.mobile);

            factory AppUse.fromMap(Map m) => AppUse(
                  (m['pkg'] as String?) ?? '',
                  (m['name'] as String?) ?? '',
                  (m['uid'] as num?)?.toInt() ?? 0,
                  (m['wifi'] as num?) ?? 0,
                  (m['mobile'] as num?) ?? 0,
                );

            /// net: 0 = Wi-Fi, 1 = mobile
            num byNet(int net) => net == 0 ? wifi : mobile;
            bool get isRealApp => pkg.isNotEmpty && !pkg.startsWith('uid:');
          }

          class AppInfo {
            final String pkg, name;
            const AppInfo(this.pkg, this.name);
          }

          class LimitStatus {
            final num used, start, end;
            final bool blocked;
            const LimitStatus(this.used, this.start, this.end, [this.blocked = false]);
            factory LimitStatus.fromMap(Map m) => LimitStatus(
                  (m['used'] as num?) ?? 0,
                  (m['start'] as num?) ?? 0,
                  (m['end'] as num?) ?? 0,
                  m['blocked'] == true,
                );
          }

          class AppDetail {
            final num wifi, mobile, fg, bg;
            final List<num> sWifi, sMobile;
            const AppDetail(this.wifi, this.mobile, this.fg, this.bg, this.sWifi, this.sMobile);

            static List<num> _list(Object? o) => ((o as List?) ?? const []).map((x) => x as num).toList();

            factory AppDetail.fromMap(Map m) => AppDetail(
                  (m['wifi'] as num?) ?? 0,
                  (m['mobile'] as num?) ?? 0,
                  (m['fg'] as num?) ?? 0,
                  (m['bg'] as num?) ?? 0,
                  _list(m['swifi']),
                  _list(m['smobile']),
                );
          }

          /// Usage of one network ("w:<Wi-Fi name>" or "m:<carrier>"; name "?" = unknown).
          class NetUse {
            final String net;
            final num bytes;
            const NetUse(this.net, this.bytes);
            bool get isWifi => net.startsWith('w:');
            String get name => net.length > 2 ? net.substring(2) : '?';
          }

          class NetApp {
            final String pkg, name;
            final int uid;
            final num bytes;
            const NetApp(this.pkg, this.name, this.uid, this.bytes);
            factory NetApp.fromMap(Map m) => NetApp(
                  (m['pkg'] as String?) ?? '',
                  (m['name'] as String?) ?? '',
                  (m['uid'] as num?)?.toInt() ?? 0,
                  (m['bytes'] as num?) ?? 0,
                );
            bool get isReal => pkg.isNotEmpty && !pkg.startsWith('uid:');
          }

          // ---------------------------------------------------------------- periods

          const periodKeys = ['today', 'week', 'month', 'm3', 'year', 'pick'];

          /// A day-aligned time range in epoch milliseconds, split into [n] chart buckets.
          class Range {
            final int s, e, n;
            final bool hourly; // single day shown as 24 hourly bars
            const Range(this.s, this.e, this.n, [this.hourly = false]);
          }

          /// Start of the billing cycle that contains [now]. [day] is 1..28.
          DateTime cycleStart(DateTime now, int day) =>
              DateTime(now.year, now.day < day ? now.month - 1 : now.month, day);

          /// Period index: 0 today, 1 week (7 days), 2 current billing cycle, 3 = 90 days, 4 = 365 days.
          Range rangeFor(int pi, int billing, [DateTimeRange? custom]) {
            final now = DateTime.now();
            int ms(DateTime d) => d.millisecondsSinceEpoch;
            final tomorrow = ms(DateTime(now.year, now.month, now.day + 1));
            switch (pi) {
              case 0:
                return Range(ms(DateTime(now.year, now.month, now.day)), tomorrow, 24, true);
              case 1:
                return Range(ms(DateTime(now.year, now.month, now.day - 6)), tomorrow, 7);
              case 2:
                {
                  final st = cycleStart(now, billing);
                  final en = DateTime(st.year, st.month + 1, st.day);
                  final days = ((ms(en) - ms(st)) / 86400000).round();
                  return Range(ms(st), ms(en), days < 1 ? 1 : days);
                }
              case 3:
                return Range(ms(DateTime(now.year, now.month, now.day - 89)), tomorrow, 13);
              case 4:
                return Range(ms(DateTime(now.year, now.month, now.day - 364)), tomorrow, 12);
              default:
                {
                  // 5 = a day (or range of days) picked by the user
                  final c = custom ??
                      DateTimeRange(start: DateTime(now.year, now.month, now.day), end: DateTime(now.year, now.month, now.day));
                  final a = DateTime(c.start.year, c.start.month, c.start.day);
                  final b = DateTime(c.end.year, c.end.month, c.end.day + 1);
                  final days = ((ms(b) - ms(a)) / 86400000).round();
                  return Range(ms(a), ms(b), days <= 1 ? 24 : (days <= 45 ? days : 15), days <= 1);
                }
            }
          }

          /// "11 May 2025" or "11 May 2025 – 20 May 2025", localized.
          String rangeLabel(BuildContext c, DateTimeRange r) {
            final l = MaterialLocalizations.of(c);
            final a = l.formatMediumDate(r.start);
            return DateUtils.isSameDay(r.start, r.end) ? a : '$a – ${l.formatMediumDate(r.end)}';
          }

          /// Linear projection of [used] to the end of range [r]; null while there is too little data.
          num? projectCycle(num used, Range r) {
            final el = DateTime.now().millisecondsSinceEpoch - r.s;
            if (el < 12 * 3600 * 1000 || used <= 0) return null;
            return used * (r.e - r.s) / el;
          }

          // ======================================================================
          // native.dart
          // ======================================================================
          /// Thin wrapper over the native MethodChannel. Every call may throw PlatformException.
          class Native {
            static const _ch = MethodChannel('dataly/native');

            static Map<String, dynamic> _m(Object? o) =>
                o == null ? <String, dynamic>{} : Map<String, dynamic>.from(o as Map);

            static Future<Map<String, dynamic>> state() async => _m(await _ch.invokeMethod('state'));
            static Future<bool> hasAccess() async => (await _ch.invokeMethod<bool>('hasAccess')) ?? false;
            static Future<void> openAccess() async => _ch.invokeMethod('openAccess');
            static Future<void> openAppData(String pkg) async => _ch.invokeMethod('openAppData', {'pkg': pkg});
            static Future<void> setLang(String lang, Map<String, String> strs) async =>
                _ch.invokeMethod('setLang', {'lang': lang, 'strs': strs});
            static Future<void> setBilling(int day) async => _ch.invokeMethod('setBilling', {'day': day});
            static Future<void> saveLimits(String json) async => _ch.invokeMethod('save', {'json': json});
            static Future<void> setSpeed(bool on) async => _ch.invokeMethod('speed', {'on': on});
            static Future<void> startMonitor() async => _ch.invokeMethod('startMonitor');
            static Future<void> resync() async => _ch.invokeMethod('resync');

            static Future<Map<String, dynamic>> load(int s, int e, int n, bool hourly) async =>
                _m(await _ch.invokeMethod('load', {'s': s, 'e': e, 'n': n, 'hourly': hourly}));

            static Future<Map<String, dynamic>> detail(String pkg, int s, int e, int n) async =>
                _m(await _ch.invokeMethod('detail', {'pkg': pkg, 's': s, 'e': e, 'n': n}));

            static Future<List<Map<String, dynamic>>> apps() async {
              final l = await _ch.invokeMethod<List>('apps') ?? const [];
              return l.map((x) => Map<String, dynamic>.from(x as Map)).toList();
            }

            static Future<Uint8List?> icon(String pkg) async => _ch.invokeMethod<Uint8List>('icon', {'pkg': pkg});
            static Future<Map<String, dynamic>> netNow() async => _m(await _ch.invokeMethod('netNow'));
            static Future<List<Map<String, dynamic>>> netUsage(int s, int e) async {
              final l = await _ch.invokeMethod<List>('netUsage', {'s': s, 'e': e}) ?? const [];
              return l.map((x) => Map<String, dynamic>.from(x as Map)).toList();
            }

            static Future<List<Map<String, dynamic>>> netApps(String net, int s, int e) async {
              final l = await _ch.invokeMethod<List>('netApps', {'net': net, 's': s, 'e': e}) ?? const [];
              return l.map((x) => Map<String, dynamic>.from(x as Map)).toList();
            }

            static Future<void> openLocationSettings() async => _ch.invokeMethod('openLocationSettings');
            static Future<void> setConsent() async => _ch.invokeMethod('setConsent');
            static Future<void> setLocked(List<String> pkgs, bool on) async =>
                _ch.invokeMethod('setLocked', {'pkgs': pkgs, 'on': on});
            static Future<Map<String, dynamic>> vpnState() async => _m(await _ch.invokeMethod('vpnState'));
            static Future<bool> prepareVpn() async => (await _ch.invokeMethod<bool>('prepareVpn')) ?? false;
            static Future<void> setVpnPolicy(String p) async => _ch.invokeMethod('setVpnPolicy', {'p': p});
            static Future<void> unblock(String pkg) async => _ch.invokeMethod('unblock', {'pkg': pkg});

            static Future<Map<String, dynamic>> limitStatus() async => _m(await _ch.invokeMethod('limitStatus'));

            static Future<void> exportCsv(int s, int e) async => _ch.invokeMethod('export', {'s': s, 'e': e});
          }

