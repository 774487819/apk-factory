          class NetworksTab extends StatelessWidget {
            final AppState s;
            const NetworksTab({super.key, required this.s});

            String _label(NetUse n) => n.name == '?' ? s.t(n.isWifi ? 'wifi_unnamed' : 'mob_unnamed') : n.name;

            @override
            Widget build(BuildContext context) => ListenableBuilder(listenable: s, builder: (c, _) => _body(c));

            Widget _nowRow(IconData icon, Color color, String text) => Row(children: [
                  Icon(icon, color: color),
                  const SizedBox(width: 10),
                  Expanded(child: Text(text, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 15, fontWeight: FontWeight.w600))),
                ]);

            Widget _body(BuildContext context) {
              final nn = s.netNow;
              final wifiOn = nn['wifiConnected'] == true;
              final wName = (nn['wifiName'] as String?) ?? '';
              final mName = (nn['mobile'] as String?) ?? '';
              final fine = nn['fine'] == true;
              final locOn = nn['locOn'] != false;
              final needLoc = wifiOn && wName.isEmpty && (!fine || !locOn);
              final num mx = s.nets.isEmpty ? 1 : s.nets.first.bytes;

              return RefreshIndicator(
                onRefresh: s.loadNets,
                child: ListView(
                  physics: const AlwaysScrollableScrollPhysics(),
                  padding: const EdgeInsets.all(16),
                  children: [
                    Text(s.t('nets_tab'), style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 12),
                    SingleChildScrollView(
                      scrollDirection: Axis.horizontal,
                      child: Row(children: [
                        for (var i = 0; i < periodKeys.length; i++)
                          Padding(
                            padding: const EdgeInsetsDirectional.only(end: 8),
                            child: ChoiceChip(
                              avatar: i == 5 ? const Icon(Icons.calendar_month_rounded, size: 18) : null,
                              label: Text(i == 5 && s.pi == 5 && s.custom != null ? rangeLabel(context, s.custom!) : s.t(periodKeys[i])),
                              selected: s.pi == i,
                              onSelected: (_) => i == 5 ? UsageTab(s: s)._pick(context) : s.setPeriod(i),
                            ),
                          ),
                      ]),
                    ),
                    const SizedBox(height: 14),
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: cardBox(),
                      child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        Text(s.t('net_now'), style: const TextStyle(color: Colors.white60, fontSize: 12)),
                        const SizedBox(height: 10),
                        _nowRow(
                          wifiOn ? Icons.wifi_rounded : Icons.wifi_off_rounded,
                          wifiOn ? kWifi : Colors.white38,
                          wifiOn ? (wName.isEmpty ? s.t('wifi_unnamed') : wName) : s.t('net_none'),
                        ),
                        const SizedBox(height: 10),
                        _nowRow(Icons.signal_cellular_alt_rounded, kMob, mName.isEmpty ? s.t('mob_unnamed') : mName),
                      ]),
                    ),
                    const SizedBox(height: 12),
                    if (needLoc)
                      InfoBanner(
                        icon: Icons.location_on_rounded,
                        text: s.t('net_loc'),
                        action: s.t(!fine ? 'allow' : 'net_loc_on'),
                        onAction: !fine ? s.allowLocation : Native.openLocationSettings,
                      ),
                    const SizedBox(height: 4),
                    Text(s.t('net_used'), style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w600)),
                    const SizedBox(height: 4),
                    Text(s.t('net_note'), style: const TextStyle(color: Colors.white54, fontSize: 12, height: 1.5)),
                    const SizedBox(height: 10),
                    if (s.nets.isEmpty)
                      Padding(
                        padding: const EdgeInsets.all(24),
                        child: Center(
                          child: Text(s.t('net_empty'), textAlign: TextAlign.center, style: const TextStyle(color: Colors.white54, height: 1.5)),
                        ),
                      ),
                    for (final n in s.nets)
                      Container(
                        margin: const EdgeInsets.only(bottom: 8),
                        decoration: cardBox(),
                        child: Theme(
                          data: Theme.of(context).copyWith(dividerColor: Colors.transparent),
                          child: ExpansionTile(
                            shape: const Border(),
                            collapsedShape: const Border(),
                            leading: Icon(n.isWifi ? Icons.wifi_rounded : Icons.signal_cellular_alt_rounded, color: n.isWifi ? kWifi : kMob),
                            title: Text(_label(n), maxLines: 1, overflow: TextOverflow.ellipsis),
                            subtitle: Padding(
                              padding: const EdgeInsets.only(top: 6),
                              child: LinearProgressIndicator(
                                value: (n.bytes / mx).toDouble(),
                                minHeight: 5,
                                borderRadius: BorderRadius.circular(4),
                                color: n.isWifi ? kWifi : kMob,
                                backgroundColor: Colors.white12,
                              ),
                            ),
                            trailing: Text(fmt(n.bytes), style: const TextStyle(fontWeight: FontWeight.w700)),
                            children: [_NetApps(s: s, net: n.net)],
                          ),
                        ),
                      ),
                  ],
                ),
              );
            }
          }

          /// Apps that used the internet on one network (loaded when the tile is expanded).
          class _NetApps extends StatefulWidget {
            final AppState s;
            final String net;
            const _NetApps({required this.s, required this.net});
            @override
            State<_NetApps> createState() => _NetAppsState();
          }

          class _NetAppsState extends State<_NetApps> {
            late final Future<List<NetApp>> f = widget.s.netApps(widget.net);

            @override
            Widget build(BuildContext context) => FutureBuilder<List<NetApp>>(
                  future: f,
                  builder: (c, snap) {
                    if (snap.connectionState != ConnectionState.done) {
                      return const Padding(
                        padding: EdgeInsets.all(16),
                        child: Center(child: SizedBox(width: 20, height: 20, child: CircularProgressIndicator(strokeWidth: 2))),
                      );
                    }
                    final l = snap.data ?? const <NetApp>[];
                    if (l.isEmpty) return const Padding(padding: EdgeInsets.all(16), child: Text('—'));
                    return Padding(
                      padding: const EdgeInsets.only(bottom: 8),
                      child: Column(children: [
                        Align(
                          alignment: AlignmentDirectional.centerStart,
                          child: Padding(
                            padding: const EdgeInsetsDirectional.fromSTEB(16, 0, 16, 4),
                            child: Text(widget.s.t('net_apps'), style: const TextStyle(color: Colors.white54, fontSize: 12)),
                          ),
                        ),
                        for (final a in l.take(30))
                          ListTile(
                            dense: true,
                            leading: a.isReal
                                ? AppIcon(s: widget.s, pkg: a.pkg, name: a.name.isEmpty ? a.pkg : a.name, size: 34)
                                : avatar(appDisplayName(widget.s, a.name, a.uid, a.pkg), size: 34),
                            title: Text(appDisplayName(widget.s, a.name, a.uid, a.pkg), maxLines: 1, overflow: TextOverflow.ellipsis),
                            trailing: Text(fmt(a.bytes), style: const TextStyle(fontWeight: FontWeight.w600)),
                          ),
                      ]),
                    );
                  },
                );
          }

          class Home extends StatefulWidget {
            final AppState state;
            const Home({super.key, required this.state});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> with WidgetsBindingObserver {
            int tab = 0;
            AppState get s => widget.state;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              s.init();
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState st) {
              if (st == AppLifecycleState.resumed && s.ready) s.init();
            }

            @override
            Widget build(BuildContext context) => ListenableBuilder(
                  listenable: s,
                  builder: (context, _) {
                    if (s.access == null) {
                      return const Scaffold(body: Center(child: CircularProgressIndicator()));
                    }
                    if (s.lang.isEmpty) return _LangScreen(s: s);
                    if (s.access == false) return _Onboard(s: s);
                    return Scaffold(
                      body: SafeArea(
                        child: IndexedStack(
                          index: tab,
                          children: [UsageTab(s: s), NetworksTab(s: s), ControlTab(s: s)],
                        ),
                      ),
                      bottomNavigationBar: NavigationBar(
                        selectedIndex: tab,
                        onDestinationSelected: (i) => setState(() => tab = i),
                        destinations: [
                          NavigationDestination(icon: const Icon(Icons.bar_chart_rounded), label: s.t('tu')),
                          NavigationDestination(icon: const Icon(Icons.wifi_rounded), label: s.t('nets_tab')),
                          NavigationDestination(icon: const Icon(Icons.tune_rounded), label: s.t('tc')),
                        ],
                      ),
                    );
                  },
                );
          }

          // ------------------------------------------------------------------ language

          class LangList extends StatelessWidget {
            final String current;
            final void Function(String) onPick;
            const LangList({super.key, required this.current, required this.onPick});

            @override
            Widget build(BuildContext context) => ListView(
                  shrinkWrap: true,
                  children: [
                    for (final e in langs.entries)
                      ListTile(
                        title: Text(e.value),
                        trailing: current == e.key ? const Icon(Icons.check_rounded, color: kMob) : null,
                        onTap: () => onPick(e.key),
                      ),
                  ],
                );
          }

          void showLangSheet(BuildContext context, AppState s) {
            showModalBottomSheet(
              context: context,
              backgroundColor: kCard,
              shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
              builder: (c) => SafeArea(
                child: LangList(
                  current: s.lang,
                  onPick: (l) {
                    Navigator.pop(c);
                    s.setLang(l);
                  },
                ),
              ),
            );
          }

          class _LangScreen extends StatelessWidget {
            final AppState s;
            const _LangScreen({required this.s});

            @override
            Widget build(BuildContext context) => Scaffold(
                  body: SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Column(children: [
                        const SizedBox(height: 32),
                        const Text('Dataly', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 8),
                        const Text('Choose your language • اختر لغتك', style: TextStyle(color: Colors.white70)),
                        const SizedBox(height: 24),
                        Expanded(child: LangList(current: '', onPick: s.setLang)),
                      ]),
                    ),
                  ),
                );
          }

          // ------------------------------------------------------------------ onboarding

          class _Onboard extends StatelessWidget {
            final AppState s;
            const _Onboard({required this.s});

            @override
            Widget build(BuildContext context) => Scaffold(
                  body: SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.all(28),
                      child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                        const Icon(Icons.data_usage_rounded, size: 72, color: kMob),
                        const SizedBox(height: 24),
                        Text(s.t('perm'), textAlign: TextAlign.center, style: const TextStyle(fontSize: 16, height: 1.5)),
                        const SizedBox(height: 28),
                        FilledButton(onPressed: Native.openAccess, child: Text(s.t('grant'))),
                        const SizedBox(height: 12),
                        TextButton(onPressed: () => showLangSheet(context, s), child: Text(s.t('lang'))),
                      ]),
                    ),
                  ),
                );
          }

          // ------------------------------------------------------------------ settings

          void showSettingsSheet(BuildContext context, AppState s) {
            showModalBottomSheet(
              context: context,
              backgroundColor: kCard,
              isScrollControlled: true,
              shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
              builder: (c) => SafeArea(
                child: ListenableBuilder(
                  listenable: s,
                  builder: (c2, _) => SingleChildScrollView(
                    child: Column(mainAxisSize: MainAxisSize.min, children: [
                      Padding(
                        padding: const EdgeInsets.fromLTRB(20, 20, 20, 8),
                        child: Align(
                          alignment: AlignmentDirectional.centerStart,
                          child: Text(s.t('settings'), style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                        ),
                      ),
                      ListTile(
                        leading: const Icon(Icons.language_rounded),
                        title: Text(s.t('lang')),
                        subtitle: Text(langs[s.lang] ?? ''),
                        onTap: () {
                          Navigator.pop(c);
                          showLangSheet(context, s);
                        },
                      ),
                      ListTile(
                        leading: const Icon(Icons.event_repeat_rounded),
                        title: Text(s.t('bill')),
                        subtitle: Text(s.t('billh')),
                        trailing: DropdownButton<int>(
                          value: s.billing,
                          underline: const SizedBox(),
                          items: [for (var d = 1; d <= 28; d++) DropdownMenuItem(value: d, child: Text('$d'))],
                          onChanged: (v) {
                            if (v != null) s.setBilling(v);
                          },
                        ),
                      ),
                      ListTile(
                        leading: const Icon(Icons.vpn_lock_rounded),
                        title: Text(s.t('vpnpol')),
                        subtitle: Text(s.t('vpnwhy'), style: const TextStyle(fontSize: 12)),
                      ),
                      for (final p in const ['skip', 'take'])
                        ListTile(
                          dense: true,
                          contentPadding: const EdgeInsetsDirectional.only(start: 72, end: 16),
                          title: Text(s.t(p == 'skip' ? 'vpn_skip' : 'vpn_take')),
                          trailing: s.vpnPolicy == p ? const Icon(Icons.check_rounded, color: kMob) : null,
                          onTap: () => s.setVpnPolicy(p),
                        ),
                      ListTile(
                        leading: const Icon(Icons.ios_share_rounded),
                        title: Text(s.t('export')),
                        subtitle: Text(s.t('exporth')),
                        onTap: () {
                          Navigator.pop(c);
                          s.exportCsv();
                        },
                      ),
                      const SizedBox(height: 8),
                    ]),
                  ),
                ),
              ),
            );
          }

          // ======================================================================
          // main.dart
          // ======================================================================
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const DatalyApp());
          }

          class DatalyApp extends StatefulWidget {
            const DatalyApp({super.key});
            @override
            State<DatalyApp> createState() => _DatalyAppState();
          }

          class _DatalyAppState extends State<DatalyApp> {
            final AppState s = AppState();
            String _lang = '';

            @override
            void initState() {
              super.initState();
              // Rebuild MaterialApp only when the language changes (drives locale + text direction).
              s.addListener(() {
                if (s.lang != _lang) setState(() => _lang = s.lang);
              });
            }

            @override
            void dispose() {
              s.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) => MaterialApp(
                  debugShowCheckedModeBanner: false,
                  navigatorKey: navKey,
                  title: 'Dataly',
                  locale: Locale(_lang.isEmpty ? 'en' : _lang),
                  supportedLocales: [for (final k in langs.keys) Locale(k)],
                  localizationsDelegates: const [
                    GlobalMaterialLocalizations.delegate,
                    GlobalWidgetsLocalizations.delegate,
                    GlobalCupertinoLocalizations.delegate,
                  ],
                  theme: ThemeData(
                    useMaterial3: true,
                    brightness: Brightness.dark,
                    scaffoldBackgroundColor: kBg,
                    colorScheme: const ColorScheme.dark(primary: kWifi, surface: kCard),
                  ),
                  home: Home(state: s),
                );
          }
