          // native.dart
          // ======================================================================
          /// Thin wrapper over the native MethodChannel. Every call may throw PlatformException.
          class Native {
            static const _ch = MethodChannel('dataly/native');

            static Map<String, dynamic> _m(Object? o) =>
                o == null ? <String, dynamic>{} : Map<String, dynamic>.from(o as Map);

            static Future<Map<String, dynamic>> state() async => _m(await _ch.invokeMethod('state'));
            static Future<bool> hasAccess() async => (await _ch.invokeMethod<bool>('hasAccess')) ?? false;
            static Future<void> openAccess() async => _ch.invokeMethod('openAccess');
            static Future<void> openAppData(String pkg) async => _ch.invokeMethod('openAppData', {'pkg': pkg});
            static Future<void> setLang(String lang, Map<String, String> strs) async =>
                _ch.invokeMethod('setLang', {'lang': lang, 'strs': strs});
            static Future<void> setBilling(int day) async => _ch.invokeMethod('setBilling', {'day': day});
            static Future<void> saveLimits(String json) async => _ch.invokeMethod('save', {'json': json});
            static Future<void> setSpeed(bool on) async => _ch.invokeMethod('speed', {'on': on});
            static Future<void> startMonitor() async => _ch.invokeMethod('startMonitor');
            static Future<void> resync() async => _ch.invokeMethod('resync');

            static Future<Map<String, dynamic>> load(int s, int e, int n, bool hourly) async =>
                _m(await _ch.invokeMethod('load', {'s': s, 'e': e, 'n': n, 'hourly': hourly}));

            static Future<Map<String, dynamic>> detail(String pkg, int s, int e, int n) async =>
                _m(await _ch.invokeMethod('detail', {'pkg': pkg, 's': s, 'e': e, 'n': n}));

            static Future<List<Map<String, dynamic>>> apps() async {
              final l = await _ch.invokeMethod<List>('apps') ?? const [];
              return l.map((x) => Map<String, dynamic>.from(x as Map)).toList();
            }

            static Future<Map<String, dynamic>> vpnState() async => _m(await _ch.invokeMethod('vpnState'));
            static Future<bool> prepareVpn() async => (await _ch.invokeMethod<bool>('prepareVpn')) ?? false;
            static Future<void> setVpnPolicy(String p) async => _ch.invokeMethod('setVpnPolicy', {'p': p});
            static Future<void> unblock(String pkg) async => _ch.invokeMethod('unblock', {'pkg': pkg});

            static Future<Map<String, dynamic>> limitStatus() async => _m(await _ch.invokeMethod('limitStatus'));

            static Future<void> exportCsv(int s, int e) async => _ch.invokeMethod('export', {'s': s, 'e': e});
          }

