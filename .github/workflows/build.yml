          // ======================================================================
          // state.dart
          // ======================================================================
          /// Single source of truth for the UI (no extra packages needed).
          class AppState extends ChangeNotifier {
            bool? access; // null = still checking
            bool ready = false;
            String lang = '';
            int sdk = 0, billing = 1;
            int pi = 1, net = 0;
            bool speed = false, loading = false, notifOk = true, needPhone = false;
            bool vpnGranted = true, otherVpn = false;
            String vpnPolicy = 'skip';
            DateTimeRange? custom; // range chosen with the date picker
            DateTime? histStart; // first day stored in the local history
            String? error;

            num wifiTotal = 0, mobTotal = 0;
            List<num> wifiSeries = [], mobSeries = [];
            List<AppUse> usage = [];
            List<AppInfo> allApps = [];
            Map<String, dynamic> limits = {};
            Map<String, LimitStatus> status = {};

            int _req = 0;

            String t(String k, [Map<String, String>? a]) => tr(lang, k, a);

            // ------------------------------------------------------------ startup
            Future<void> init() async {
              try {
                final st = await Native.state();
                limits = Map<String, dynamic>.from(jsonDecode((st['limits'] as String?) ?? '{}') as Map);
                speed = st['speed'] == true;
                lang = (st['lang'] as String?) ?? '';
                sdk = (st['sdk'] as num?)?.toInt() ?? 0;
                billing = (st['bill'] as num?)?.toInt() ?? 1;
                vpnPolicy = (st['vpn_policy'] as String?) ?? 'skip';
                final hs = (st['hist_start'] as num?)?.toInt() ?? 0;
                histStart = hs > 0 ? DateTime.fromMillisecondsSinceEpoch(hs) : null;
                ready = true;
                access = await Native.hasAccess();
              } catch (_) {
                access ??= false;
              }
              notifyListeners();
              if (access == true && lang.isNotEmpty) await _afterAccess();
            }

            Future<void> _afterAccess() async {
              unawaited(Native.startMonitor().catchError((_) {}));
              await _checkPerms();
              unawaited(load());
              unawaited(loadStatus());
              unawaited(refreshVpn());
              if (allApps.isEmpty) {
                try {
                  allApps = (await Native.apps()).map((m) => AppInfo(m['pkg'] as String, m['name'] as String)).toList();
                  notifyListeners();
                } catch (_) {}
              }
            }

            Future<void> _checkPerms() async {
              try {
                notifOk = await Permission.notification.isGranted;
              } catch (_) {}
              if (sdk > 0 && sdk < 29) {
                try {
                  needPhone = !(await Permission.phone.isGranted);
                } catch (_) {}
              }
              notifyListeners();
            }

            // ------------------------------------------------------------ permissions
            Future<void> allowNotifications() async {
              final r = await Permission.notification.request();
              notifOk = r.isGranted;
              notifyListeners();
              if (r.isPermanentlyDenied) await openAppSettings();
            }

            /// Android 8-9 only: needed to read mobile-data usage.
            Future<void> grantPhone() async {
              final r = await Permission.phone.request();
              needPhone = !r.isGranted;
              notifyListeners();
              if (r.isPermanentlyDenied) await openAppSettings();
              if (r.isGranted) {
                await Native.resync();
                await load();
              }
            }

            // ------------------------------------------------------------ settings
            Future<void> setLang(String l) async {
              lang = l;
              notifyListeners();
              try {
                await Native.setLang(l, {for (final k in nativeKeys) k: t(k)});
              } catch (_) {}
              if (access == true) await _afterAccess();
            }

            Future<void> setBilling(int d) async {
              billing = d;
              notifyListeners();
              try {
                await Native.setBilling(d);
              } catch (_) {}
              unawaited(load());
              unawaited(loadStatus());
            }

            Future<void> toggleSpeed(bool v) async {
              if (v) {
                final r = await Permission.notification.request();
                notifOk = r.isGranted;
              }
              try {
                await Native.setSpeed(v);
                speed = v;
              } catch (_) {}
              notifyListeners();
            }

            Future<void> saveLimits() async {
              notifyListeners();
              try {
                await Native.saveLimits(jsonEncode(limits));
              } catch (_) {}
              if (limits.isNotEmpty && !await Permission.notification.isGranted) {
                final r = await Permission.notification.request();
                notifOk = r.isGranted;
                notifyListeners();
              }
              // blocking is evaluated natively right after saving; refresh the badges a moment later
              unawaited(Future.delayed(const Duration(seconds: 2)).then((_) {
                loadStatus();
                refreshVpn();
              }));
            }

            // ------------------------------------------------------------ blocking (local VPN)
            bool get blockEnabled => limits.values.any((l) => l is Map && l['block'] == true);

            Future<void> refreshVpn() async {
              try {
                final m = await Native.vpnState();
                vpnGranted = m['granted'] == true;
                otherVpn = m['other'] == true;
                notifyListeners();
              } catch (_) {}
            }

            /// Shows Android's VPN consent dialog if needed.
            Future<void> ensureVpn() async {
              try {
                vpnGranted = await Native.prepareVpn();
              } catch (_) {}
              notifyListeners();
              await refreshVpn();
              unawaited(loadStatus());
            }

            Future<void> setVpnPolicy(String p) async {
              vpnPolicy = p;
              notifyListeners();
              try {
                await Native.setVpnPolicy(p);
              } catch (_) {}
              await refreshVpn();
            }

            Future<void> unblock(String pkg) async {
              try {
                await Native.unblock(pkg);
              } catch (_) {}
              await Future.delayed(const Duration(milliseconds: 500));
              await loadStatus();
            }

            Future<void> exportCsv() async {
              final r = rangeFor(pi, billing, custom);
              try {
                await Native.exportCsv(r.s, r.e);
              } catch (_) {}
            }

            // ------------------------------------------------------------ data
            void setPeriod(int i) {
              pi = i;
              load();
            }

            void setCustom(DateTimeRange r) {
              custom = r;
              pi = 5;
              load();
            }

            void setNet(int i) {
              net = i;
              notifyListeners();
            }

            Future<void> load() async {
              final id = ++_req;
              loading = true;
              error = null;
              notifyListeners();
              try {
                final r = rangeFor(pi, billing, custom);
                final m = await Native.load(r.s, r.e, r.n, r.hourly);
                if (id != _req) return; // a newer request replaced this one
                wifiTotal = (m['wifi'] as num?) ?? 0;
                mobTotal = (m['mobile'] as num?) ?? 0;
                wifiSeries = ((m['swifi'] as List?) ?? const []).map((x) => x as num).toList();
                mobSeries = ((m['smobile'] as List?) ?? const []).map((x) => x as num).toList();
                usage = ((m['usage'] as List?) ?? const []).map((x) => AppUse.fromMap(x as Map)).toList();
              } catch (e) {
                if (id == _req) error = '$e';
              } finally {
                if (id == _req) {
                  loading = false;
                  notifyListeners();
                }
              }
            }

            Future<void> loadStatus() async {
              try {
                final m = await Native.limitStatus();
                status = m.map((k, v) => MapEntry(k, LimitStatus.fromMap(v as Map)));
                notifyListeners();
              } catch (_) {}
            }
          }

          // ======================================================================
          // control_tab.dart
          // ======================================================================
          String _fmtDur(AppState s, num ms) {
            final h = ms / 3600000;
            if (h < 48) return '${h < 10 ? h.toStringAsFixed(1) : h.round()} ${s.t('uh')}';
            return '${(h / 24).round()} ${s.t('ud')}';
          }

          String _mbText(num bytes) {
            final v = bytes / 1048576;
            return v == v.roundToDouble() ? v.toInt().toString() : v.toStringAsFixed(1);
          }

          class ControlTab extends StatefulWidget {
            final AppState s;
            const ControlTab({super.key, required this.s});
            @override
            State<ControlTab> createState() => _ControlTabState();
          }

          class _ControlTabState extends State<ControlTab> {
            String q = '';
            AppState get s => widget.s;

            /// Pace-based forecast text for an app that has a limit, or null.
            (String, bool)? _forecast(String pkg, Map lim) {
              final st = s.status[pkg];
              if (st == null) return null;
              final limit = lim['bytes'] as num;
              if (st.used >= limit || st.used <= 0) return null;
              final now = DateTime.now().millisecondsSinceEpoch;
              final el = now - st.start;
              if (el < 3600000) return null; // need at least an hour of data
              final msLeft = (limit - st.used) / (st.used / el);
              if (now + msLeft > st.end) return (s.t('fcok'), false);
              return (s.t('fc', {'t': _fmtDur(s, msLeft)}), true);
            }

            @override
            Widget build(BuildContext context) => ListenableBuilder(listenable: s, builder: (c, _) => _body(c));

            Widget _body(BuildContext context) {
              final netNames = {'wifi': s.t('ws'), 'mobile': s.t('ms'), 'all': s.t('all')};
              final perNames = {'day': s.t('daily'), 'month': s.t('monthly')};
              final list = s.allApps.where((a) => a.name.toLowerCase().contains(q.toLowerCase())).toList()
                ..sort((a, b) {
                  final la = s.limits.containsKey(a.pkg) ? 0 : 1;
                  final lb = s.limits.containsKey(b.pkg) ? 0 : 1;
                  return la != lb ? la.compareTo(lb) : a.name.toLowerCase().compareTo(b.name.toLowerCase());
                });

              return Padding(
                padding: const EdgeInsets.fromLTRB(16, 16, 16, 0),
                child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text(s.t('ct'), style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
                  const SizedBox(height: 6),
                  Text(s.t('ch'), style: const TextStyle(color: Colors.white60, fontSize: 13)),
                  const SizedBox(height: 12),
                  if (s.limits.isNotEmpty && !s.notifOk)
                    InfoBanner(
                      icon: Icons.notifications_off_rounded,
                      text: s.t('notif_off'),
                      action: s.t('allow'),
                      onAction: s.allowNotifications,
                    ),
                  if (s.blockEnabled && !s.vpnGranted)
                    InfoBanner(
                      icon: Icons.vpn_key_rounded,
                      text: s.t('vpn_need'),
                      action: s.t('allow'),
                      onAction: s.ensureVpn,
                    ),
                  if (s.blockEnabled && s.otherVpn && s.vpnPolicy == 'skip')
                    InfoBanner(icon: Icons.vpn_lock_rounded, text: s.t('vpnwhy'), color: kWifi),
                  if (s.limits.isNotEmpty && !s.speed)
                    InfoBanner(icon: Icons.info_outline_rounded, text: s.t('fasthint'), color: kWifi),
                  TextField(
                    onChanged: (v) => setState(() => q = v),
                    decoration: InputDecoration(
                      hintText: s.t('search'),
                      prefixIcon: const Icon(Icons.search_rounded),
                      filled: true,
                      fillColor: kCard,
                      border: OutlineInputBorder(borderRadius: BorderRadius.circular(16), borderSide: BorderSide.none),
                    ),
                  ),
                  const SizedBox(height: 10),
                  Expanded(
                    child: ListView.builder(
                      itemCount: list.length,
                      itemBuilder: (c, i) {
                        final a = list[i];
                        final lim = s.limits[a.pkg] as Map?;
                        final st = s.status[a.pkg];
                        final fc = lim == null ? null : _forecast(a.pkg, lim);
                        final limit = (lim?['bytes'] as num?) ?? 0;
                        return Padding(
                          padding: const EdgeInsets.only(bottom: 8),
                          child: Material(
                            color: kCard,
                            borderRadius: BorderRadius.circular(16),
                            child: InkWell(
                              borderRadius: BorderRadius.circular(16),
                              onTap: () => _openSheet(c, a.pkg, a.name),
                              child: Padding(
                                padding: const EdgeInsets.all(12),
                                child: Row(children: [
                                  avatar(a.name),
                                  const SizedBox(width: 12),
                                  Expanded(
                                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                      Row(children: [
                                        Expanded(child: Text(a.name, maxLines: 1, overflow: TextOverflow.ellipsis)),
                                        if (st?.blocked == true)
                                          Container(
                                            margin: const EdgeInsetsDirectional.only(start: 8),
                                            padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                            decoration: BoxDecoration(
                                              color: Colors.redAccent.withValues(alpha: .18),
                                              borderRadius: BorderRadius.circular(8),
                                            ),
                                            child: Text(s.t('blocked'),
                                                style: const TextStyle(color: Colors.redAccent, fontSize: 11, fontWeight: FontWeight.w700)),
                                          ),
                                      ]),
                                      if (lim != null) ...[
                                        const SizedBox(height: 4),
                                        Text(
                                          '${s.t('limit')} ${fmt(limit)} • ${netNames[lim['net']]} • ${perNames[lim['period']]}',
                                          style: const TextStyle(color: kMob, fontSize: 12),
                                        ),
                                        if (st != null && limit > 0) ...[
                                          const SizedBox(height: 6),
                                          LinearProgressIndicator(
                                            value: (st.used / limit).clamp(0, 1).toDouble(),
                                            minHeight: 5,
                                            borderRadius: BorderRadius.circular(4),
                                            color: st.used >= limit ? Colors.redAccent : (st.used >= limit * .8 ? kWarn : kMob),
                                            backgroundColor: Colors.white12,
                                          ),
                                          const SizedBox(height: 4),
                                          Text('${s.t('used')}: ${fmt(st.used)} / ${fmt(limit)}',
                                              style: const TextStyle(fontSize: 11.5, color: Colors.white70)),
                                        ],
                                        if (fc != null)
                                          Padding(
                                            padding: const EdgeInsets.only(top: 2),
                                            child: Text(fc.$1,
                                                style: TextStyle(fontSize: 11.5, color: fc.$2 ? kWarn : Colors.white54)),
                                          ),
                                      ],
                                    ]),
                                  ),
                                  Icon(lim == null ? Icons.add_circle_outline_rounded : Icons.edit_rounded, size: 20),
                                ]),
                              ),
                            ),
                          ),
                        );
                      },
                    ),
                  ),
                ]),
              );
            }

            void _openSheet(BuildContext context, String pkg, String name) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: kCard,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
                builder: (_) => LimitSheet(s: s, pkg: pkg, name: name),
              );
            }
          }

          class LimitSheet extends StatefulWidget {
            final AppState s;
