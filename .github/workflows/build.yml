          rm -rf $RES/mipmap-anydpi-v26
          if ! command -v convert >/dev/null 2>&1; then sudo apt-get update -y && sudo apt-get install -y imagemagick; fi
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            convert icon192.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
          done

      - name: Install Android SDK Platform 37 (optional, Gradle also auto-downloads it)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" || "$SDKM" "platforms;android-37" || echo "Platform 37 will be fetched by Gradle"

      - name: Set up release signing (only when the keystore secrets exist)
        working-directory: app_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: the build is signed with the DEBUG key and cannot be uploaded to Google Play."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          python3 - <<'PY'
          import pathlib
          p = next(pathlib.Path('android/app').glob('build.gradle*'))
          t = p.read_text()
          if p.suffix == '.kts':
              block = '''    signingConfigs {
                  create("release") {
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

          '''
              t2 = t.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          else:
              block = '''    signingConfigs {
                  release {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

          '''
              t2 = t.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          assert t2 != t, 'debug signingConfig line not found in ' + str(p)
          assert '    buildTypes {' in t2, 'buildTypes block not found'
          t2 = t2.replace('    buildTypes {', block + '    buildTypes {', 1)
          p.write_text(t2)
          print('release signing configured in', p)
          PY

      - name: Build release AAB + APK
        working-directory: app_build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # permission_handler 13 needs compileSdk 37; the Flutter template uses 36.
          # Notification channels / foreground service need minSdk 26.
          # Google Play requires new apps to target Android 16 (API 36).
          sed -i 's/flutter\.minSdkVersion/26/' android/app/build.gradle*
          sed -i 's/flutter\.compileSdkVersion/37/' android/app/build.gradle*
          sed -i 's/flutter\.targetSdkVersion/36/' android/app/build.gradle*
          echo "android.suppressUnsupportedCompileSdk=37" >> android/gradle.properties
          grep -n "compileSdk\|minSdk\|targetSdk\|signingConfig" android/app/build.gradle*
          flutter pub get
          # prints every Dart error in one short list (does not stop the build)
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error|Analyzing|issues? found|No issues" || true
          set +e
          flutter build appbundle --release --build-name=1.0.0 --build-number=${{ github.run_number }} 2>&1 | tee build_aab.log
          AAB_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$AAB_STATUS" -ne 0 ]; then
            echo "=================== ERRORS (copy these lines) ==================="
            grep -E "^e: |: error|Unresolved reference|Type mismatch|None of the following|Overload resolution|Cannot infer|Expecting" build_aab.log | head -60 || true
            exit 1
          fi
          flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Upload AAB (this is the file you upload to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: dataly-aab
          path: app_build/build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK (for installing directly on a phone)
        uses: actions/upload-artifact@v4
        with:
          name: dataly-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
