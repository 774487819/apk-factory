          class _AppIconState extends State<AppIcon> {
            Uint8List? bytes;

            @override
            void initState() {
              super.initState();
              bytes = widget.s.iconCache[widget.pkg];
              if (bytes == null) _load();
            }

            @override
            void didUpdateWidget(AppIcon old) {
              super.didUpdateWidget(old);
              if (old.pkg != widget.pkg) {
                bytes = widget.s.iconCache[widget.pkg];
                if (bytes == null) _load();
              }
            }

            Future<void> _load() async {
              final b = await widget.s.iconFor(widget.pkg);
              if (mounted && b != null) setState(() => bytes = b);
            }

            @override
            Widget build(BuildContext context) {
              final b = bytes;
              if (b == null) return avatar(widget.name, size: widget.size);
              return ClipRRect(
                borderRadius: BorderRadius.circular(widget.size / 3.5),
                child: Image.memory(b, width: widget.size, height: widget.size, gaplessPlayback: true),
              );
            }
          }

