          class LimitSheet extends StatefulWidget {
            final AppState s;
            final String pkg, name;
            const LimitSheet({super.key, required this.s, required this.pkg, required this.name});
            @override
            State<LimitSheet> createState() => _LimitSheetState();
          }

          class _LimitSheetState extends State<LimitSheet> {
            late final TextEditingController ctl;
            late String net, per;
            late bool block;
            bool bad = false;
            AppState get s => widget.s;
            Map? get old => s.limits[widget.pkg] as Map?;

            @override
            void initState() {
              super.initState();
              final o = old;
              ctl = TextEditingController(text: o == null ? '100' : _mbText(o['bytes'] as num));
              net = (o?['net'] as String?) ?? 'mobile';
              per = (o?['period'] as String?) ?? 'month';
              block = (o?['block'] as bool?) ?? false;
            }

            @override
            void dispose() {
              ctl.dispose();
              super.dispose();
            }

            void _save() {
              final mb = double.tryParse(ctl.text.trim().replaceAll(',', '.'));
              if (mb == null || mb <= 0) {
                setState(() => bad = true);
                return;
              }
              s.limits[widget.pkg] = {'bytes': (mb * 1048576).round(), 'net': net, 'period': per, 'block': block};
              final wantsBlock = block;
              Navigator.pop(context);
              s.saveLimits().then((_) async {
                if (!wantsBlock) return;
                await s.refreshVpn();
                if (!s.vpnGranted) await s.ensureVpn();
              });
            }

            @override
            Widget build(BuildContext context) => SafeArea(
                  child: Padding(
                    padding: EdgeInsets.fromLTRB(20, 20, 20, 20 + MediaQuery.of(context).viewInsets.bottom),
                    child: SingleChildScrollView(
                      child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                        Row(children: [
                          AppIcon(s: s, pkg: widget.pkg, name: widget.name),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Text(widget.name,
                                maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                          ),
                        ]),
                        const SizedBox(height: 16),
                        TextField(
                          controller: ctl,
                          keyboardType: const TextInputType.numberWithOptions(decimal: true),
                          decoration: InputDecoration(
                            labelText: s.t('lmb'),
                            errorText: bad ? s.t('badnum') : null,
                            border: OutlineInputBorder(borderRadius: BorderRadius.circular(14)),
                          ),
                        ),
                        const SizedBox(height: 14),
                        SizedBox(
                          width: double.infinity,
                          child: SegmentedButton<String>(
                            segments: [
                              ButtonSegment(value: 'mobile', label: Text(s.t('ms'))),
                              ButtonSegment(value: 'wifi', label: Text(s.t('ws'))),
                              ButtonSegment(value: 'all', label: Text(s.t('all'))),
                            ],
                            selected: {net},
                            onSelectionChanged: (v) => setState(() => net = v.first),
                          ),
                        ),
                        const SizedBox(height: 10),
                        SizedBox(
                          width: double.infinity,
                          child: SegmentedButton<String>(
                            segments: [
                              ButtonSegment(value: 'day', label: Text(s.t('daily'))),
                              ButtonSegment(value: 'month', label: Text(s.t('monthly'))),
                            ],
                            selected: {per},
                            onSelectionChanged: (v) => setState(() => per = v.first),
                          ),
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          value: block,
                          onChanged: (v) => setState(() => block = v),
                          title: Text(s.t('block'), style: const TextStyle(fontSize: 14)),
                          subtitle: Text(s.t('blockh'), style: const TextStyle(fontSize: 12)),
                        ),
                        if (s.status[widget.pkg]?.blocked == true)
                          Padding(
                            padding: const EdgeInsets.only(bottom: 8),
                            child: FilledButton.tonal(
                              onPressed: () {
                                Navigator.pop(context);
                                s.unblock(widget.pkg);
                              },
                              child: Text(s.t('unblock')),
                            ),
                          ),
                        const SizedBox(height: 6),
                        OutlinedButton.icon(
                          onPressed: () => Native.openAppData(widget.pkg),
                          icon: const Icon(Icons.open_in_new_rounded, size: 18),
                          label: Text(s.t('opensettings')),
                        ),
                        const SizedBox(height: 10),
                        Row(children: [
                          if (old != null)
                            Expanded(
                              child: TextButton(
                                onPressed: () {
                                  s.limits.remove(widget.pkg);
                                  Navigator.pop(context);
                                  s.saveLimits();
                                },
                                child: Text(s.t('remove')),
                              ),
                            ),
                          Expanded(child: FilledButton(onPressed: _save, child: Text(s.t('save')))),
                        ]),
                      ]),
                    ),
