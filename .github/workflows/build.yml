          class UsageTab extends StatelessWidget {
            final AppState s;
            const UsageTab({super.key, required this.s});

            String _name(AppUse a) {
              if (a.name.isNotEmpty) return a.name;
              return a.uid == -4
                  ? s.t('removed')
                  : a.uid == -5
                      ? s.t('teth')
                      : s.t('sys');
            }

            /// Date-range picker limited to the days that exist in the local history.
            Future<void> _pick(BuildContext context) async {
              final now = DateTime.now();
              final today = DateTime(now.year, now.month, now.day);
              var first = s.histStart ?? today.subtract(const Duration(days: 89));
              first = DateTime(first.year, first.month, first.day);
              if (first.isAfter(today)) first = today;
              var init = s.custom ?? DateTimeRange(start: today, end: today);
              if (init.start.isBefore(first) || init.end.isAfter(today)) init = DateTimeRange(start: today, end: today);
              final r = await showDateRangePicker(
                context: context,
                firstDate: first,
                lastDate: today,
                initialDateRange: init,
                helpText: s.t('pick'),
              );
              if (r != null) s.setCustom(r);
            }

            @override
            Widget build(BuildContext context) => ListenableBuilder(listenable: s, builder: (c, _) => _body(c));

            Widget _body(BuildContext context) {
              final isWifi = s.net == 0;
              final col = isWifi ? kWifi : kMob;
              final list = s.usage.where((a) => a.byNet(s.net) > 0).toList()
                ..sort((a, b) => b.byNet(s.net).compareTo(a.byNet(s.net)));
              final num mx = list.isEmpty ? 1 : list.first.byNet(s.net);
              final series = isWifi ? s.wifiSeries : s.mobSeries;
              final total = isWifi ? s.wifiTotal : s.mobTotal;
              final proj = s.pi == 2 ? projectCycle(total, rangeFor(2, s.billing)) : null;

              return RefreshIndicator(
                onRefresh: s.load,
                child: ListView(
                  physics: const AlwaysScrollableScrollPhysics(),
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(children: [
                      const Expanded(child: Text('Dataly', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold))),
                      if (s.loading)
                        const Padding(
                          padding: EdgeInsets.only(right: 8),
                          child: SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2)),
                        ),
                      IconButton(
                        icon: const Icon(Icons.settings_rounded),
                        tooltip: s.t('settings'),
                        onPressed: () => showSettingsSheet(context, s),
                      ),
                    ]),
                    const SizedBox(height: 8),
                    if (s.needPhone)
                      InfoBanner(
                        icon: Icons.phone_android_rounded,
                        text: s.t('phone_why'),
                        action: s.t('grant'),
                        onAction: s.grantPhone,
                      ),
                    if (s.error != null)
                      InfoBanner(
                        icon: Icons.error_outline_rounded,
                        text: s.t('err'),
                        action: s.t('retry'),
                        onAction: s.load,
                        color: Colors.redAccent,
                      ),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 4),
                      decoration: cardBox(),
                      child: SwitchListTile(
                        contentPadding: EdgeInsets.zero,
                        title: Text(s.t('speed'), style: const TextStyle(fontSize: 14)),
                        value: s.speed,
                        onChanged: s.toggleSpeed,
                      ),
                    ),
                    const SizedBox(height: 14),
                    SingleChildScrollView(
                      scrollDirection: Axis.horizontal,
                      child: Row(children: [
                        for (var i = 0; i < periodKeys.length; i++)
                          Padding(
                            padding: const EdgeInsetsDirectional.only(end: 8),
                            child: ChoiceChip(
                              avatar: i == 5 ? const Icon(Icons.calendar_month_rounded, size: 18) : null,
                              label: Text(i == 5 && s.pi == 5 && s.custom != null
                                  ? rangeLabel(context, s.custom!)
                                  : s.t(periodKeys[i])),
                              selected: s.pi == i,
                              onSelected: (_) => i == 5 ? _pick(context) : s.setPeriod(i),
                            ),
                          ),
                      ]),
                    ),
                    const SizedBox(height: 14),
                    Row(children: [
                      NetCard(label: s.t('uw'), value: s.wifiTotal, color: kWifi, selected: isWifi, onTap: () => s.setNet(0)),
                      const SizedBox(width: 12),
                      NetCard(label: s.t('um'), value: s.mobTotal, color: kMob, selected: !isWifi, onTap: () => s.setNet(1)),
                    ]),
                    const SizedBox(height: 14),
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: cardBox(),
                      child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        Text('${s.t('total')}: ${fmt(s.wifiTotal + s.mobTotal)}',
                            style: const TextStyle(fontSize: 15, fontWeight: FontWeight.w700)),
                        const SizedBox(height: 12),
                        BarChart(values: series, color: col),
                        if (proj != null) ...[
                          const SizedBox(height: 12),
                          Row(children: [
                            Icon(Icons.trending_up_rounded, size: 18, color: col),
                            const SizedBox(width: 8),
                            Text('${s.t('proj')}: ${fmt(proj)}', style: const TextStyle(fontSize: 13)),
                          ]),
                        ],
                      ]),
                    ),
                    const SizedBox(height: 18),
                    Text(s.t('top'), style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w600)),
                    const SizedBox(height: 8),
                    for (final a in list.take(40))
                      Padding(
                        padding: const EdgeInsets.only(bottom: 8),
                        child: Material(
                          color: kCard,
                          borderRadius: BorderRadius.circular(16),
                          child: InkWell(
                            borderRadius: BorderRadius.circular(16),
                            onTap: a.isRealApp
                                ? () => Navigator.of(context).push(MaterialPageRoute(
                                    builder: (_) => AppDetailScreen(s: s, pkg: a.pkg, name: _name(a))))
                                : null,
                            child: Padding(
                              padding: const EdgeInsets.all(12),
                              child: Row(children: [
                                a.isRealApp ? AppIcon(s: s, pkg: a.pkg, name: _name(a)) : avatar(_name(a)),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                    Text(_name(a), maxLines: 1, overflow: TextOverflow.ellipsis),
                                    const SizedBox(height: 6),
                                    LinearProgressIndicator(
                                      value: (a.byNet(s.net) / mx).toDouble(),
                                      minHeight: 5,
                                      borderRadius: BorderRadius.circular(4),
                                      color: col,
                                      backgroundColor: col.withValues(alpha: .15),
                                    ),
                                  ]),
                                ),
                                const SizedBox(width: 12),
                                Text(fmt(a.byNet(s.net)), style: const TextStyle(fontWeight: FontWeight.w600)),
                              ]),
                            ),
                          ),
                        ),
                      ),
                    if (list.isEmpty && !s.loading)
                      Padding(
                        padding: const EdgeInsets.all(24),
                        child: Center(
                          child: Text(
                            s.pi == 5 ? s.t('nodata') : '—',
                            textAlign: TextAlign.center,
                            style: const TextStyle(color: Colors.white54, height: 1.5),
                          ),
                        ),
                      ),
                  ],
                ),
              );
            }
          }

